[mypy]
python_version = 3.14
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
follow_imports = silent
allow_any_unimported = true

# Exclude legacy scripts, test files, migrations, and non-source dirs
exclude = (test_|add_|setup_|migrate|start\.py$|celery_worker\.py$|run_tests\.py$|add_columns|scripts/|docs/|tests/|tests_legacy/|venv/|__pycache__/|src/|scratch)
