apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacgenie-backend
  namespace: iacgenie
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: iacgenie-backend
  template:
    metadata:
      labels:
        app: iacgenie-backend
        version: v1
    spec:
      containers:
        - name: backend
          image: ${REGISTRY:-ghcr.io/iacgenie}/backend:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8080
              name: metrics
          envFrom:
            - configMapRef:
                name: iacgenie-config
            - secretRef:
                name: iacgenie-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace/sandboxes
        - name: workspace-cleanup
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "Running TTL-based cleanup of orphaned workspaces..."
                find /workspace/sandboxes -mindepth 1 -maxdepth 1 -type d -mmin +60 -exec rm -rf {} +
                sleep 3600
              done
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace/sandboxes
          securityContext:
            allowPrivilegeEscalation: false #:
            runAsNonRoot: false
      volumes:
        - name: workspace-volume
          emptyDir: {}
