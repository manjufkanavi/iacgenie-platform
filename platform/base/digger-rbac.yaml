apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: digger-job-manager
  namespace: default
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: digger-job-manager-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: default # Assuming the backend runs as the default service account, otherwise update this
  namespace: default
roleRef:
  kind: Role
  name: digger-job-manager
  apiGroup: rbac.authorization.k8s.io
