apiVersion: v1
kind: ConfigMap
metadata:
  name: iacgenie-config
data:
  ENVIRONMENT: "staging"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis-service:6379/0"
  DATABASE_URL: "postgresql://postgres@db-service:5432/iacgenie"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  OTEL_SERVICE_NAME: "iacgenie-backend"
  PROMETHEUS_METRICS_ENABLED: "true"
  # LiteLLM Gateway
  LITELLM_CONFIG_PATH: "./src/llm_proxy/litellm_config.yaml"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
