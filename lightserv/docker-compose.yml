# LightSerp — Docker Compose (Unified Infrastructure v4.0)
#
# Architecture: LightPanda headless browser runs as a native binary inside the
# lightserp container, invoked via stdio JSON-RPC. No separate scraping service
# is needed — scraping is baked into the MCP server process itself.
#
# New in v4.0:
#   - HTTP-based MCP transport (SSE) for remote client connections
#   - Proxy rotation for search and scrape requests
#   - Bound to 0.0.0.0 for external access via Cloudflare Tunnel
#
# Shared infrastructure provided by docker-compose-unified.yml:
#   - PostgreSQL 15 (lightsrp schema, port 5432)
#   - Redis 7 (db 1, port 6379)
#   - SearXNG (port 8080)
#   - NSQ (port 4150)
#   - MinIO (port 9000)
#   - Keycloak (port 8080)
#   - OpenBao (port 8200)
#
# Run alongside unified stack:
#   docker compose -f docker-compose-unified.yml -f docker-compose.yml up -d
#
# MCP transports:
#   - Stdio: stdin/stdout JSON-RPC (for local Claude Desktop, Cursor, etc.)
#   - SSE:   http://<host>:7805/mcp (for remote HTTP-based MCP clients)

name: lightserp-unified

services:
  # ── LightSerp MCP Server ────────────────────────────────────────
  lightserp:
    build: .
    container_name: lightserp-mcp
    ports:
      # HTTP health/API endpoint (also accessible via Cloudflare Tunnel)
      - "0.0.0.0:3001:3001"
      # MCP-over-SSE endpoint (HTTP-based MCP transport for remote clients)
      - "0.0.0.0:7805:7805"
    env_file:
      - config/.env.api
    environment:
      - NODE_ENV=production
      - HTTP_PORT=3001
      - HTTP_HOST=0.0.0.0
      - MCP_SSE_PORT=7805
      # Unified infrastructure service endpoints (Docker network)
      - SEARXNG_URL=http://searxng:8080/search?format=json
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - DATABASE_URL=postgresql://lightsrp:***@postgres:5432/lightsrp
      - NSQD_URL=nsqd:4150
      - NSQ_LOOKUPD_URL=nsqlookupd:4160
      - KEYCLOAK_URL=http://keycloak:8080/realms/unified
      - KEYCLOAK_CLIENT_ID=lightsrp
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=***
      # LightPanda binary configuration (native, no HTTP service)
      - LIGHTPANDA_BIN=/usr/local/bin/lightpanda
      - MAX_CONCURRENT_SCRAPES=10
      - LIGHTPANDA_TIMEOUT_MS=30000
      - LIGHTPANDA_MAX_BYTES=65536
      # Proxy configuration (optional, comma-separated URLs)
      # Examples:
      #   - PROXY_URLS=http://proxy1:8080,http://proxy2:8080
      #   - PROXY_URLS=http://user:pass@proxy:8080
      - PROXY_URLS=disabled
      # JWT secret for token generation
      - JWT_SECRET=***
      # Cache TTL for scraped content (seconds)
      - SCRAPING_CACHE_TTL=3600
    depends_on:
      searxng:
        condition: service_healthy
      redis:
        condition: service_healthy
      nsqd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lightserp-net
      - unified_network

# ── Networks ─────────────────────────────────────────────────────────
networks:
  lightserp-net:
    driver: bridge
  unified_network:
    external: true
