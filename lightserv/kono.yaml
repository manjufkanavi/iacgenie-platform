# Kono API Gateway Configuration for LightSERP
# This configuration provides rate limiting, authentication, and routing for the MCP server

server:
  host: 0.0.0.0
  port: 7805
  read_timeout: 30s
  write_timeout: 30s
  graceful_shutdown_timeout: 10s

# Rate limiting configuration
rate_limit:
  default:
    max_requests: 30
    interval: 60s
    key: "ip"
  authenticated:
    max_requests: 60
    interval: 60s
    key: "user"

# Authentication configuration
auth:
  jwt:
    enabled: true
    secret: ${JWT_SECRET:-change-me-in-production}
    issuer: ${A12N_ISSUER_URL:-http://localhost:8083}
    audience: lightserp
    header: Authorization
    scheme: Bearer

# Upstream services
upstreams:
  - id: mcp-server
    target: http://mcp-server:7805
    health_check:
      path: /health
      interval: 30s

# Routes
endpoints:
  - path: /.*
    methods: ["GET", "POST", "PUT", "DELETE"]
    upstream:
      url: "http://mcp-server:7805"
      timeout: 60s
    rate_limit:
      max_requests: 30
      interval: 60s
      key: "ip"

  # Authenticated routes with higher rate limits
  - path: /search_web_auth
    methods: ["POST"]
    upstream:
      url: "http://mcp-server:7805"
      timeout: 60s
    rate_limit:
      max_requests: 60
      interval: 60s
      key: "user"
    auth:
      jwt: true

  - path: /scrape_page_auth
    methods: ["POST"]
    upstream:
      url: "http://mcp-server:7805"
      timeout: 60s
    rate_limit:
      max_requests: 60
      interval: 60s
      key: "user"
    auth:
      jwt: true

  # Public routes (no auth)
  - path: /search_web
    methods: ["POST"]
    upstream:
      url: "http://mcp-server:7805"
      timeout: 60s
    rate_limit:
      max_requests: 30
      interval: 60s
      key: "ip"

  - path: /scrape_page
    methods: ["POST"]
    upstream:
      url: "http://mcp-server:7805"
      timeout: 60s
    rate_limit:
      max_requests: 30
      interval: 60s
      key: "ip"

  - path: /generate_token
    methods: ["POST"]
    upstream:
      url: "http://mcp-server:7805"
      timeout: 30s
    rate_limit:
      max_requests: 10
      interval: 60s
      key: "ip"

# Health check endpoint
health_check:
  path: /healthz
  interval: 30s

# Logging
logging:
  level: info
  format: json
  file: /var/log/kono/kono.log

# CORS
cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Requested-With
  max_age: 86400