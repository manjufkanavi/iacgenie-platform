apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"
      cacheLevel: "High"
      disableRecordingRules: false
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: "logtide"

  - name: LogTide
    type: loki
    access: proxy
    url: http://logtide:8080
    jsonData:
      derivedFields:
        - datasourceUid: "prometheus"
          matcherRegex: "traceID=(\\w+)"
          name: "TraceID"
          url: "$${__value.raw}"

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: logtide
    user: postgres
    secureJsonData:
      password: "postgres"
    jsonData:
      sslmode: "disable"
      postgresVersion: 1200
      timescaledb: true