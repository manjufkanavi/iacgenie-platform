# Bandit config for iacgenie-platform SAST
# Curated to reduce false positives.
# - B101 (assert) is common in tests; skip.
# - B105/B106/B107 (hardcoded passwords) are often example/placeholder values; skip.
# - B110 (try/except pass) is intentional in many places; skip.
# - B311 (random) is not a real vuln for non-security contexts; skip.
# - B404/B603/B607 (subprocess) are flagged by default but subprocess is a
#   legitimate tool; report as LOW only.
# - B324 (weak MD5) is real — keep HIGH.
# - B608/B113 (SQL injection / requests without timeout) are real — keep.

[tool.bandit]
exclude_dirs = ["tests", "test", "migrations", "alembic", "scripts", "docs"]
skips = ["B101", "B105", "B106", "B107", "B110", "B311", "B404", "B603", "B607"]
