# Mypy config for iacgenie-platform SAST
# Curated to reduce false positives.
# The codebase is largely untyped (FastAPI + pydantic). We disable the
# noisiest error codes and keep only genuinely actionable ones.

[mypy]
python_version = 3.14
ignore_missing_imports = true
no_error_summary = true
follow_imports = skip

# Disable noisy codes that produce false positives on untyped codebases
disable_error_code = no-untyped-def, import-untyped, arg-type, return-value, operator, union-attr, attr-defined, call-arg, type-arg, var-annotated, no-any-return, no-untyped-call, misc, name-defined, import-not-found

# Mirror the project's own excludes (platform/backend/mypy.ini) so we don't
# scan legacy/untyped code the project deliberately skips.
exclude = (
    test_|add_|setup_|migrate|start\.py$|celery_worker\.py$|run_tests\.py$|
    add_columns|scripts/|docs/|tests/|tests_legacy/|venv/|__pycache__/|
    src/|scratch
)
