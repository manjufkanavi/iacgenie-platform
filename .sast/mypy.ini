# Mypy config for iacgenie-platform SAST
# Curated to reduce false positives.
# The codebase is largely untyped (FastAPI + pydantic). We disable the
# noisiest error codes and keep only genuinely actionable ones.

[mypy]
python_version = 3.11
ignore_missing_imports = true
no_error_summary = true
follow_imports = skip

# Disable noisy codes that produce false positives on untyped codebases
disable_error_code = no-untyped-def, import-untyped, assignment, arg-type, return-value, operator, union-attr, attr-defined, call-arg, type-arg, var-annotated, no-any-return, no-untyped-call, misc, name-defined, import-not-found
