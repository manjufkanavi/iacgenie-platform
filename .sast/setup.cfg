# Flake8 config for iacgenie-platform SAST
# Mirrors .sast/ruff.toml: only report Pyflakes (F) real bugs.
# Style rules (E/W) are excluded — noise for a security-focused scan.
[flake8]
max-line-length = 120
select = F
ignore =
exclude = .git,__pycache__,node_modules,build,dist,.venv,venv
per-file-ignores =
    __init__.py:F401
