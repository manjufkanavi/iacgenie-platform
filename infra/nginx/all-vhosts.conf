# OpenBao — vault.iacgenie.com vhost
# Reverse proxy to local OpenBao instance on port 8200
# OpenBao runs in dev mode (HTTP only), served over HTTPS via Nginx reverse proxy

server {
    listen 80;
    server_name vault.iacgenie.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # OpenBao dev mode uses HTTP
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8200/v1/sys/health;
        access_log off;
    }
}
# Gitea — gitea.iacgenie.com vhost
# Reverse proxy to local Gitea instance on port 3000

server {
    listen 80;
    server_name gitea.iacgenie.com;

    client_max_body_size 50m;

    # ── Reverse Proxy to Gitea ────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket for Git operations
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Gitea uploads can be large
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Health Check ──────────────────────────────────────────
    location /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }
}
# =========================================================
# Nginx reverse-proxy for TerraGenius (terraform.iacgenie.com)
# =========================================================
# Serves: React frontend (port 5173) + backend API (port 8000)
#         Grafana (3001) + Prometheus (9090) + Alertmanager (9093)
#         Jaeger (16686) + Keycloak (8080) + Gitea (3000)
# =========================================================

upstream iacgenie_backend {
    server 127.0.0.1:8000;
}

upstream iacgenie_frontend {
    server 127.0.0.1:5173;
}

upstream iacgenie_gitea {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name terra.iacgenie.com;

    client_max_body_size 50m;

    # ---------- React frontend ----------
    location / {
        proxy_pass http://iacgenie_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket for Vite dev server / HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---------- Backend API ----------
    location /api/ {
        proxy_pass http://iacgenie_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket for SSE / real-time workflows
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout for long-running AI generation
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- Keycloak auth proxy ----------
    location /auth/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Gitea ----------
    location /gitea/ {
        proxy_pass http://iacgenie_gitea/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Grafana ----------
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Prometheus ----------
    location /prometheus/ {
        proxy_pass http://127.0.0.1:9090/prometheus/;
        proxy_set_header Host $host;
    }

    # ---------- Jaeger UI ----------
    location /jaeger/ {
        proxy_pass http://127.0.0.1:16686/jaeger/;
        proxy_set_header Host $host;
    }

    # ---------- OpenBao ----------
    location /openbao/ {
        proxy_pass http://127.0.0.1:8200/openbao/;
        proxy_set_header Host $host;
    }

    # ---------- MinIO ----------
    location /minio/ {
        proxy_pass http://127.0.0.1:9002/minio/;
        proxy_set_header Host $host;
    }

    # ---------- MinIO Console ----------
    location /minio-console/ {
        proxy_pass http://127.0.0.1:9003/minio-console/;
        proxy_set_header Host $host;
    }

    # ---------- Alertmanager ----------
    location /alertmanager/ {
        proxy_pass http://127.0.0.1:9093/alertmanager/;
        proxy_set_header Host $host;
    }
}
# Keycloak — auth.iacgenie.com vhost
# Reverse proxy to local Keycloak instance

server {
    listen 80;
    server_name auth.iacgenie.com;

    # ── Health Check ──────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    # ── Reverse Proxy to Keycloak ─────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
# LightSerp WebUI — lightserp.iacgenie.com
# The web application (Next.js on port 3070)
# SearXNG is INTERNAL ONLY — not exposed to internet.
# MCP tool calls (search/scrape) go through lightserp-api:3071 → SearXNG (internal)

server {
    listen 80;
    server_name lightserp.iacgenie.com;

    # ── Health check ──────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3071/health;
        access_log off;
    }

    # ── Web UI ────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── API proxy (MCP tools, scrape, auth) ──────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3071/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:3071/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
