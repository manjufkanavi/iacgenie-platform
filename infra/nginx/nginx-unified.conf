# =============================================================================
# Nginx Unified Infrastructure — Security-Hardened Configuration
# =============================================================================
# Version: 3.0
# Date: 2026-08-03
#
# Security additions:
#   - HTTPS with TLS (Let's Encrypt via Certbot)
#   - Security headers (CSP, HSTS, X-Frame-Options, etc.)
#   - Rate limiting
#   - Disable unnecessary HTTP methods
#   - TLS v1.2+ only
#   - Health check endpoint for Cloudflare Load Balancer
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Upstream definitions
upstream iacgenie_backend {
    server 127.0.0.1:5173;
}

upstream lightsrp_backend {
    server 127.0.0.1:3070;
}

upstream grafana { server 127.0.0.1:3000; }
upstream prometheus { server 127.0.0.1:9090; }
upstream minio_console { server 127.0.0.1:9001; }
upstream keycloak { server 127.0.0.1:8080; }

# =============================================================================
# Catch-all vHost — Reject unknown *.iacgenie.com subdomains
# This MUST be the first server block after health checks to ensure
# it takes precedence for any unmatched *.iacgenie.com subdomains.
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name *.iacgenie.com iacgenie.com;

    # Return 404 for any unknown subdomain under iacgenie.com
    return 404 '{"error":"Not Found","message":"No service registered for this subdomain","redirect":"https://iacgenie.com"}';
    add_header Content-Type application/json always;
}

server {
    listen 443 ssl http2 default_server;
    server_name *.iacgenie.com iacgenie.com;

    # TLS configuration — minimum viable for catch-all
    ssl_certificate     /etc/letsencrypt/live/iacgenie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iacgenie.com/privkey.pem;
    ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Return 404 for unknown HTTPS subdomains
    return 404 '{"error":"Not Found","message":"No service registered for this subdomain","redirect":"https://iacgenie.com"}';
    add_header Content-Type application/json always;
}

# =============================================================================
# HTTP → HTTPS redirect (production)
# =============================================================================
server {
    listen 80;
    server_name iacgenie.local lightsrp.local infra.local auth.local;
    return 301 https://$host$request_uri;
}

# =============================================================================
# Health Check Endpoint — For Cloudflare Load Balancer probing
# =============================================================================
server {
    listen 127.0.0.1:8888;
    server_name _;

    # Simple health check — returns 200 if nginx is running
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"iacgenie-nginx","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    location /healthz {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }
}

# =============================================================================
# HTTPS — IacGenie
# =============================================================================
server {
    listen 443 ssl http2;
    server_name iacgenie.local;

    # TLS configuration — Let's Encrypt certificates
    ssl_certificate     /etc/letsencrypt/live/iacgenie.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iacgenie.local/privkey.pem;
    ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (for production with real certs)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    # Disable dangerous HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH)$) {
        return 405;
    }

    location / {
        proxy_pass http://iacgenie_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        proxy_pass http://iacgenie_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://iacgenie_backend;
        expires 30d;
        add_header Cache-Control 'public, immutable';
    }
}

# =============================================================================
# HTTPS — LightSerp
# =============================================================================
server {
    listen 443 ssl http2;
    server_name lightsrp.local;

    # TLS configuration — Let's Encrypt certificates
    ssl_certificate     /etc/letsencrypt/live/lightsrp.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lightsrp.local/privkey.pem;
    ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    # Disable dangerous HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH)$) {
        return 405;
    }

    location / {
        proxy_pass http://lightsrp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 300;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        proxy_pass http://lightsrp_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_hide_header X-Powered-By;
    }
}

# =============================================================================
# HTTPS — Infrastructure Dashboard (Grafana, Prometheus, MinIO, Keycloak)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name infra.local;

    # TLS configuration — Let's Encrypt certificates
    ssl_certificate     /etc/letsencrypt/live/infra.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infra.local/privkey.pem;
    ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting (more restrictive for admin endpoints)
    limit_req zone=general burst=10 nodelay;

    # Disable dangerous HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        rewrite ^/grafana/(.*) /$1 break;
    }

    location /prometheus/ {
        proxy_pass http://prometheus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /minio/ {
        proxy_pass http://minio_console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /keycloak/ {
        proxy_pass http://keycloak/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;

        # Auth endpoint rate limiting
        if ($uri ~* /login*) {
            limit_req zone=auth burst=5 nodelay;
        }
    }
}

# =============================================================================
# Bind-specific — Grafana (127.0.0.1 only)
# =============================================================================
server {
    listen 127.0.0.1:3000;
    server_name grafana.iacgenie.com;

    # TLS configuration — Let's Encrypt certificates
    ssl_certificate     /etc/letsencrypt/live/grafana.iacgenie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.iacgenie.com/privkey.pem;
    ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req zone=general burst=10 nodelay;

    location / {
        proxy_pass http://grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
