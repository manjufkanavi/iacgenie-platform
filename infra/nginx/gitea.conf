# Gitea — gitea.iacgenie.com vhost
# Reverse proxy to local Gitea instance on port 3000

server {
    listen 80;
    server_name gitea.iacgenie.com;

    client_max_body_size 50m;

    # ── Reverse Proxy to Gitea ────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket for Git operations
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Gitea uploads can be large
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Health Check ──────────────────────────────────────────
    location /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }
}