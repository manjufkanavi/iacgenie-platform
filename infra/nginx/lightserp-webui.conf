# LightSerp WebUI — lightserp.iacgenie.com
# The web application (Next.js on port 3001)
# SearXNG is INTERNAL ONLY — not exposed to internet.
# MCP tool calls (search/scrape) go through api.iacgenie.com

server {
    listen 80;
    server_name lightserp.iacgenie.com;

    # ── Health check ──────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # ── Web UI ────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# IacGenie Platform — platform.iacgenie.com
# UI proxy only (backend via internal api.iacgenie.com)
server {
    listen 80;
    server_name platform.iacgenie.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}