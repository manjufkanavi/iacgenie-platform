# LightSerp WebUI — lightserp.iacgenie.com
# The web application (Next.js on port 3070)
# SearXNG is INTERNAL ONLY — not exposed to internet.
# MCP tool calls (search/scrape) go through lightserp-api:3071 → SearXNG (internal)

server {
    listen 80;
    server_name lightserp.iacgenie.com;

    # ── Health check ──────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3071/health;
        access_log off;
    }

    # ── Web UI ────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── API proxy (MCP tools, scrape, auth) ──────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3071/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:3071/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}