# ansible.cfg — Kokoro TTS deployment for homeserver (192.168.0.116)
[defaults]
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
stderr_callback = skip
roles_path = ./roles
inventory = ./inventory.ini
forks = 10

[ssh_connection]
pipelining = True
control_path_dir = ~/.ansible/cp
retries = 2

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
