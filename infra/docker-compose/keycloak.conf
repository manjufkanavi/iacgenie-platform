# Keycloak Configuration for iacgenie platform
# Managed by Ansible - do not edit manually
# Read-only mount at /opt/keycloak/conf/keycloak.conf in container

# Database (PostgreSQL driver baked into image via 'kc.sh build --db postgres')
db=postgres
db-url-host=postgres
db-url-port=5432
db-url-database=keycloak

# HTTP
http-enabled=true
http-port=8080

# Hostname (external access)
hostname=https://auth.iacgenie.com
hostname-admin=https://auth.iacgenie.com
hostname-admin-sts=https://auth.iacgenie.com

# Admin Bootstrap (for first-boot admin user creation)
bootstrap-admin-username=admin
bootstrap-admin-password=CHANGE_ME_IN_VAULT

# =====================
# Resume Platform Client (auto-created on import)
# =====================
# Client ID: resume-platform
# Client Type: confidential
# Redirect URI: https://resume.iacgenie.com/api/v1/auth/callback
# Valid URIs: https://resume.iacgenie.com/*
# Web Origins: https://resume.iacgenie.com
# Standard Flow: Enabled
# Direct Access Grants: Disabled
# Service Accounts: Disabled
# Secret: stored in OpenBao at secret/resume-platform/client-secret
