# =============================================================================
# IacGenie Unified Infrastructure - Docker Compose Configuration
# Phase 10.17-10.22: Logging, Monitoring, Resource Quotas, Tunnel Redundancy
# =============================================================================

networks:
  iacgenie_network:
    driver: bridge
    name: iacgenie_network

volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  openbao_data: null
  openbao_raft: null
  gitea_data: null
  keycloak_data: null
  loki_data: null
  prometheus_data: null
  grafana_data: null

x-common-settings:
  restart: unless-stopped
  networks: &id001
    iacgenie_network: null
  security_opt: &id002
  - no-new-privileges:true
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- Core Database ---
  postgres:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: postgres:15-alpine
    container_name: iacgenie-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_KC_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_LOGTIDE_PASSWORD: ${POSTGRES_LOGTIDE_PASSWORD}
    volumes:
    - /home/mkanavi/docker/iacgenie/postgres_data:/var/lib/postgresql/data
    - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/99-init-users.sql
    ports:
    - 127.0.0.1:5432:5432
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    user: postgres:postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: redis:7-alpine
    container_name: iacgenie-redis
    command:
    - redis-server
    - --save
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD}
    volumes:
    - /home/mkanavi/docker/iacgenie/redis_data:/data/redis
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --- Storage & Secrets ---
  minio:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: minio/minio:latest
    container_name: iacgenie-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://minio.iacgenie.com
      MINIO_BROWSER_REDIRECT_URL: https://console.minio.iacgenie.com
    volumes:
    - /home/mkanavi/docker/iacgenie/minio_data:/data/minio
    command: server /data/minio --console-address ":9001"
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  openbao:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: quay.io/openbao/openbao:2.6.0
    container_name: iacgenie-openbao
    volumes:
    - /home/mkanavi/docker/iacgenie/openbao_raft:/openbao/raft
    - /home/mkanavi/docker/iacgenie/openbao_data:/openbao/data
    - /home/mkanavi/docker/iacgenie/bootstrap_openbao.sh:/openbao/scripts/bootstrap_openbao.sh:ro
    - /home/mkanavi/docker/iacgenie/scripts/backup_openbao.py:/opt/scripts/backup_openbao.py:ro
    command: server -config=/openbao/data/openbao-prod.hcl
    ports:
    - 127.0.0.1:8200:8200
    environment:
    - OPENBAO_UI=true
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/bin/bao status --address http://127.0.0.1:8200 | grep -q Initialized || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  keycloak:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: quay.io/keycloak/keycloak:26.0
    container_name: iacgenie-keycloak
    command: start-dev --import-realm
    env_file:
    - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://iacgenie-postgres:***@ss2026!
      GITEA__admin__INIT_ROOT_USER_EMAIL: admin@iacgenie.com
      GITEA__server__SSH_LISTEN_PORT: 2222
      GITEA__server__START_SSH_SERVER: 'true'
      OPENBAO_ADDR: https://vault.iacgenie.com
      OPENBAO_TOKEN: ${IACGENIE_OPENBAO_TOKEN}
      OPENBAO_MOUNT_PATH: iacgenie/kv
      OPENBAO_CA_CERT: /opt/app/certs/ca.crt
    volumes:
    - /home/mkanavi/docker/iacgenie/gitea_data:/data/gitea
    - /home/mkanavi/docker/iacgenie/openbao_data/certs/ca.crt:/opt/app/certs/ca.crt:ro
    depends_on:
    - postgres
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3000/
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  lightserp-webui:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: lightserp-lightserp-webui:latest
    container_name: iacgenie-lightserp-webui
    environment:
    - NODE_ENV=production
    - PORT=3070
    - API_URL=http://iacgenie-lightserp-api:3071
    - NEXT_PUBLIC_API_URL=http://iacgenie-lightserp-api:3071
    ports:
    - 127.0.0.1:3070:3070
    depends_on:
    - lightserp-api
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/node
      - /opt/hc_webui.js
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
    - /home/mkanavi/docker/iacgenie/scripts/hc_webui.js:/opt/hc_webui.js:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  lightserp-api:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: lightserp-lightserp-api:latest
    container_name: iacgenie-lightserp-api
    env_file:
    - /home/mkanavi/workspace/LightSerp/config/.env.api
    ports:
    - 127.0.0.1:3071:3071
    environment:
      OPENBAO_ADDR: https://vault.iacgenie.com
      OPENBAO_TOKEN: ${LIGHTSERP_OPENBAO_TOKEN}
      OPENBAO_MOUNT_PATH: lightserp/kv
      OPENBAO_CA_CERT: /opt/app/certs/ca.crt
    volumes:
    - /home/mkanavi/docker/iacgenie/openbao_data/certs/ca.crt:/opt/app/certs/ca.crt:ro
    depends_on:
    - postgres
    - redis
    - lightserp-nsqd
    healthcheck:
      test:
      - CMD-SHELL
      - timeout 5 bash -c 'echo >/dev/tcp/localhost/3071' 2>/dev/null || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  lightserp-searxng:
    restart: unless-stopped
    networks:
      iacgenie_network:
        aliases:
        - lightserp-searxng
    security_opt: *id002
    logging: *default-logging
    image: searxng/searxng:latest
    container_name: iacgenie-searxng
    ports:
    - 127.0.0.1:8081:8080
    volumes:
    - /home/mkanavi/workspace/LightSerp/searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  lightserp-nsqd:
    restart: unless-stopped
    networks:
      iacgenie_network:
        aliases:
        - lightserp-nsqd
    security_opt: *id002
    logging: *default-logging
    image: nsqio/nsq:latest
    container_name: iacgenie-nsqd
    command:
    - /nsqd
    - --broadcast-address=iacgenie-nsqd
    - --broadcast-tcp-port=4150
    - --broadcast-http-port=4161
    - --http-address=0.0.0.0:4161
    ports:
    - 127.0.0.1:8071:4150
    - 127.0.0.1:8072:4161
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:4161/ping
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  lightserp-pagezen:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: lightserp-pagezen:latest
    container_name: iacgenie-pagezen
    ports:
    - 127.0.0.1:8076:8082
    depends_on:
    - lightserp-api
    healthcheck:
      test:
      - CMD-SHELL
      - timeout 5 bash -c 'echo >/dev/tcp/localhost/8082' 2>/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
    - /home/mkanavi/docker/iacgenie/scripts/hc_webui.js:/opt/hc_webui.js:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --- Phase 10.17: Centralized Logging ---
  loki:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: grafana/loki:2.9.0
    container_name: iacgenie-loki
    volumes:
    - loki_data:/opt/infrastructure/loki
    - ./configs/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
    - 127.0.0.1:3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3100/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  promtail:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: grafana/promtail:2.9.0
    container_name: iacgenie-promtail
    volumes:
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    - /var/log:/var/log:ro
    - ./configs/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    - /tmp:/tmp
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # --- Phase 10.18: Monitoring Stack ---
  prometheus:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: prom/prometheus:v2.50.0
    container_name: iacgenie-prometheus
    volumes:
    - prometheus_data:/prometheus
    - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./configs/prometheus/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    ports:
    - 127.0.0.1:9090:9090
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.retention.time=30d'
    - '--web.enable-lifecycle'
    - '--web.enable-admin-api'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:9090/-/healthy || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  grafana:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: grafana/grafana:10.3.0
    container_name: iacgenie-grafana
    env_file:
    - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://grafana.iacgenie.com
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
    - 127.0.0.1:3000:3000
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --- Phase 10.21: Cloudflare Tunnel Redundancy ---
  cloudflared:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: cloudflare/cloudflared:latest
    container_name: iacgenie-cloudflared
    command: tunnel --no-autoupdate run
    environment:
    - TUNNEL_TOKEN=${CLOU..._TOKEN}
    volumes:
    - ./configs/cloudflared:/etc/cloudflared/config:ro
    - /home/mkanavi/docker/iacgenie/cloudflared_creds:/etc/cloudflared/creds
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  cloudflared-2:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: cloudflare/cloudflared:latest
    container_name: iacgenie-cloudflared-2
    command: tunnel --no-autoupdate run
    environment:
    - TUNNEL_TOKEN=${CLOU..._TOKEN_2}
    volumes:
    - ./configs/cloudflared:/etc/cloudflared/config:ro
    - /home/mkanavi/docker/iacgenie/cloudflared_creds_2:/etc/cloudflared/creds
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # --- Nginx Reverse Proxy (managed in compose) ---
  nginx:
    restart: unless-stopped
    networks: *id001
    security_opt: *id002
    logging: *default-logging
    image: nginx:1.25-alpine
    container_name: iacgenie-nginx
    volumes:
    - ./nginx-unified.conf:/etc/nginx/conf.d/default.conf:ro
    - ./certs:/etc/nginx/ssl:ro
    ports:
    - 127.0.0.1:443:443
    - 127.0.0.1:80:80
    depends_on:
    - grafana
    - prometheus
    - keycloak
    healthcheck:
      test:
      - CMD-SHELL
      - nginx -t 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
