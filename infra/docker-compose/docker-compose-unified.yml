services:
  postgres:
    image: postgres:15-alpine
    container_name: iacgenie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - /home/mkanavi/docker/iacgenie/data/postgres:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 2g
  redis:
    image: redis:7-alpine
    container_name: iacgenie_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512m --maxmemory-policy allkeys-lru
    volumes:
    - /home/mkanavi/docker/iacgenie/data/redis:/data
    ports:
    - 127.0.0.1:6379:6379
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
  minio:
    image: minio/minio:latest
    container_name: iacgenie_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - /home/mkanavi/docker/iacgenie/data/minio:/data
    ports:
    - 127.0.0.1:9000:9000
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 4g
  minio-console:
    image: nginx:1.27-alpine
    container_name: iacgenie_minio_console_proxy
    restart: unless-stopped
    ports:
    - 127.0.0.1:9001:9001
    networks:
    - iacgenie-frontend
    - iacgenie-backend
    depends_on:
    - minio
    volumes:
    - ./minio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
  openbao:
    image: openbao/openbao:2.6.0
    container_name: iacgenie_openbao
    restart: unless-stopped
    command: bao server -config=/openbao/raft/openbao-prod.hcl
    user: "100:1000"
    environment:
      OPENBAO_ADDR: http://127.0.0.1:8200
      OPENBAO_CLUSTER_ADDR: http://127.0.0.1:8201
      OPENBAO_UI: 'true'
      OPENBAO_LOG_LEVEL: info
      BAO_SKIP_DROP_ROOT: 'true'
    volumes:
    - /home/mkanavi/docker/iacgenie/data/openbao:/openbao/storage
    - /home/mkanavi/docker/iacgenie/openbao_raft:/openbao/raft
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD
      - /usr/bin/bao
      - status
      - --address
      - http://127.0.0.1:8200
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - SETGID
    - SETUID
    - DAC_OVERRIDE
    - IPC_LOCK
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
  keycloak:
    image: quay.io/keycloak/keycloak:26.0-pg
    container_name: iacgenie_keycloak
    restart: unless-stopped
    command:
    - start
    - --http-enabled=true
    - --http-port=8080
    - --db=postgres
    - --import-realm
    - --hostname=https://auth.iacgenie.com
    - --hostname-admin=https://auth.iacgenie.com
    - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_DB_HOST: ${KC_DB_HOST}
      KC_DB_PORT: ${KC_DB_PORT}
      KC_DB_NAME: ${KC_DB_NAME}
    volumes:
    - /home/mkanavi/docker/iacgenie/data/keycloak:/opt/keycloak/data
    - ./keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
    - /run/secrets/keycloak_admin_password
    - /run/secrets/keycloak_db_password
    ports:
    - 127.0.0.1:8083:8080
    networks:
    - iacgenie-backend
    depends_on:
    - postgres
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    - /opt/keycloak/bin:noexec,nosuid
    pids_limit: 1024
    shm_size: 256m
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q -T 2 http://127.0.0.1:8080/health/live || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
  gitea:
    image: gitea/gitea:1.23.4-rootless
    container_name: iacgenie_gitea
    restart: unless-stopped
    environment:
      USER: gitea
      GITEA__database__DB_TYPE: postgres
      GITEA__database__CONN_STRING: postgresql://gitea:${GITEA_DB_PASS}@postgres:5432/gitea?sslmode=verify-full
      GITEA__admin__INIT_ROOT_USER_NAME: ${GITEA_ADMIN_USERNAME:-admin}
      GITEA__admin__INIT_ROOT_USER_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__security__DISABLE_REGISTRATION: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__service__REGISTER_EMAIL_CONFIRM: 'true'
      GITEA__service__ENABLE_NOTIFY_MAIL: 'true'
      GITEA__service__REQUIRE_SIGNIN_VIEW: 'true'
      GITEA__mailer__ENABLED: 'true'
      GITEA__mailer__SMTP_ADDR: mail.smtp2go.com
      GITEA__mailer__SMTP_PORT: '2525'
      GITEA__mailer__USER: ${GITEA_SMTP_USER:-admin@zencloudsec.com}
      GITEA__mailer__PASSWD: ${GITEA_SMTP_PASS:-}
      GITEA__mailer__FROM: ${SMTP_FROM:-noreply@iacgenie.com}
      GITEA__mailer__SMTP_PROTO: smtps
      GITEA__security__DISABLE_GRAVATAR: 'true'
      GITEA__security__ENABLE_CAPTCHA: 'true'
      GITEA__security__MIN_PASSWORD_LENGTH: 12
      GITEA__security__DEFAULT_ENABLE_2FA: 'true'
      GITEA__session__SESSION_LIFETIME: 3600
      GITEA__session__COOKIE_SECURE: 'true'
      GITEA__security__DEFAULT_ENABLE_QUOTAS: 'true'
      GITEA__api__ENABLE_SWAGGER: 'false'
    volumes:
    - /home/mkanavi/docker/iacgenie/data/gitea:/var/lib/gitea
    - /home/mkanavi/docker/iacgenie/data/gitea:/etc/gitea
    ports:
    - 127.0.0.1:3000:3000
    - 127.0.0.1:2222:2222
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
  lightserp-api:
    image: lightserp-lightserp-api:latest
    container_name: iacgenie_lightserp_api
    restart: unless-stopped
    # Hardened per Antares security audit (2026-08-17)
    ports:
    - 127.0.0.1:8000:3000
    environment:
      LOGTIDE_URL: http://localhost:4318/v1/traces
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY_FILE: /run/secrets/lightserp_minio_secret_key
      NSQD_ADDR: nsqd:4150
      LIGHTSERP_PAGEZEN_API: http://pagezen:8082
      SEARXNG_URL: http://searxng:8080
      LIGHTSERP_S3_BASE: iacgenie-lightserp
      LIGHTSERP_ALLOW_INSECURE: "false"
      REDIS_PASSWORD_FILE: /run/secrets/lightserp_redis_password
      LIGHTSERP_API_SECRET_FILE: /run/secrets/lightserp_api_secret
      LIGHTSERP_DATABASE_URL_FILE: /run/secrets/lightserp_database_url
      LIGHTSERP_KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/lightserp_keycloak_client_secret
    secrets:
    - lightserp_api_secret
    - lightserp_database_url
    - lightserp_keycloak_client_secret
    - lightserp_minio_secret_key
    - lightserp_redis_password
    volumes:
    - ../ansible/roles/openbao/files/inject-secrets.sh:/usr/local/bin/inject-secrets.sh:ro
    - ../ansible/roles/openbao/files/openbao_injector.py:/usr/local/bin/openbao_injector.py:ro
    - ../ansible/roles/openbao/files/configs:/etc/openbao-config:ro
    - openbao-approle:/var/run/approle
    # Read-only filesystem (antires: writable root)
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    # Healthcheck (antires: no health monitoring)
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: []
    networks:
    - iacgenie-frontend

networks:
  iacgenie-frontend:
    driver: bridge
  iacgenie-backend:
    driver: bridge
  iacgenie-messaging:
    driver: bridge
volumes:
  openbao-appprope: null
