services:
  postgres:
    image: postgres:15-alpine
    container_name: iacgenie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - /home/mkanavi/docker/iacgenie/data/postgres:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 2g
  redis:
    image: redis:7-alpine
    container_name: iacgenie_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512m --maxmemory-policy allkeys-lru
    volumes:
    - /home/mkanavi/docker/iacgenie/data/redis:/data
    ports:
    - 127.0.0.1:6379:6379
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
  minio:
    image: minio/minio:latest
    container_name: iacgenie_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - /home/mkanavi/docker/iacgenie/data/minio:/data
    ports:
    - 127.0.0.1:9000:9000
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 4g
  minio-console:
    image: nginx:1.27-alpine
    container_name: iacgenie_minio_console_proxy
    restart: unless-stopped
    ports:
    - 127.0.0.1:9001:9001
    networks:
    - iacgenie-frontend
    - iacgenie-backend
    depends_on:
    - minio
    volumes:
    - ./minio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
  openbao:
    image: openbao/openbao:2.6.0
    container_name: iacgenie_openbao
    restart: unless-stopped
    command: bao server -config=/openbao/raft/openbao-prod.hcl
    user: 100:1000
    environment:
      OPENBAO_ADDR: http://127.0.0.1:8200
      OPENBAO_CLUSTER_ADDR: http://127.0.0.1:8201
      OPENBAO_UI: 'true'
      OPENBAO_LOG_LEVEL: info
      BAO_SKIP_DROP_ROOT: 'true'
    volumes:
    - /home/mkanavi/docker/iacgenie/data/openbao:/openbao/storage
    - /home/mkanavi/docker/iacgenie/openbao_raft:/openbao/raft
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD
      - /usr/bin/bao
      - status
      - --address
      - http://127.0.0.1:8200
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - SETGID
    - SETUID
    - DAC_OVERRIDE
    - IPC_LOCK
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
  keycloak:
    image: quay.io/keycloak/keycloak:26.0-pg
    container_name: iacgenie_keycloak
    restart: unless-stopped
    command:
    - start
    - --http-enabled=true
    - --http-port=8080
    - --db=postgres
    - --import-realm
    - --hostname=https://auth.iacgenie.com
    - --hostname-admin=https://auth.iacgenie.com
    - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_DB_HOST: ${KC_DB_HOST}
      KC_DB_PORT: ${KC_DB_PORT}
      KC_DB_NAME: ${KC_DB_NAME}
    volumes:
    - /home/mkanavi/docker/iacgenie/data/keycloak:/opt/keycloak/data
    - ./keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
    - /run/secrets/keycloak_admin_password
    - /run/secrets/keycloak_db_password
    ports:
    - 127.0.0.1:8083:8080
    networks:
    - iacgenie-backend
    depends_on:
    - postgres
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    - /opt/keycloak/bin:noexec,nosuid
    pids_limit: 1024
    shm_size: 256m
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q -T 2 http://127.0.0.1:8080/health/live || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '3'
  gitea:
    image: gitea/gitea:1.23.4-rootless
    container_name: iacgenie_gitea
    restart: unless-stopped
    environment:
      USER: gitea
      GITEA__database__DB_TYPE: postgres
      GITEA__database__CONN_STRING: postgresql://gitea:${GITEA_DB_PASS}@postgres:5432/gitea?sslmode=verify-full
      GITEA__admin__INIT_ROOT_USER_NAME: ${GITEA_ADMIN_USERNAME:-admin}
      GITEA__admin__INIT_ROOT_USER_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__security__DISABLE_REGISTRATION: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__service__REGISTER_EMAIL_CONFIRM: 'true'
      GITEA__service__ENABLE_NOTIFY_MAIL: 'true'
      GITEA__service__REQUIRE_SIGNIN_VIEW: 'true'
      GITEA__mailer__ENABLED: 'true'
      GITEA__mailer__SMTP_ADDR: mail.smtp2go.com
      GITEA__mailer__SMTP_PORT: '2525'
      GITEA__mailer__USER: ${GITEA_SMTP_USER:-admin@zencloudsec.com}
      GITEA__mailer__PASSWD: ${GITEA_SMTP_PASS:-}
      GITEA__mailer__FROM: ${SMTP_FROM:-noreply@iacgenie.com}
      GITEA__mailer__SMTP_PROTO: smtps
      GITEA__security__DISABLE_GRAVATAR: 'true'
      GITEA__security__ENABLE_CAPTCHA: 'true'
      GITEA__security__MIN_PASSWORD_LENGTH: 12
      GITEA__security__DEFAULT_ENABLE_2FA: 'true'
      GITEA__session__SESSION_LIFETIME: 3600
      GITEA__session__COOKIE_SECURE: 'true'
      GITEA__security__DEFAULT_ENABLE_QUOTAS: 'true'
      GITEA__api__ENABLE_SWAGGER: 'false'
    volumes:
    - /home/mkanavi/docker/iacgenie/data/gitea:/var/lib/gitea
    - /home/mkanavi/docker/iacgenie/data/gitea:/etc/gitea
    ports:
    - 127.0.0.1:3000:3000
    - 127.0.0.1:2222:2222
    networks:
    - iacgenie-backend
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
  lightserp-api:
    image: lightserp-lightserp-api:latest
    container_name: iacgenie_lightserp_api
    restart: unless-stopped
    environment:
      LOGTIDE_URL: http://localhost:4318/v1/traces
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      NSQD_ADDR: nsqd:4150
      LIGHTSERP_PAGEZEN_API: http://pagezen:8082
      SEARXNG_URL: http://searxng:8080
      LIGHTSERP_S3_BASE: iacgenie-lightserp
      LIGHTSERP_ALLOW_INSECURE: 'false'
      MINIO_SECRET_KEY_FILE: ${MINIO_ROOT_PASSWORD}
      REDIS_PASSWORD_FILE: /run/secrets/lightserp_redis_password${REDIS_PASSWORD}
      LIGHTSERP_API_SECRET_FILE: LIGHTSERP_API_SECRET_FILE
      LIGHTSERP_DATABASE_URL_FILE: LIGHTSERP_DATABASE_URL_FILE
      LIGHTSERP_KEYCLOAK_CLIENT_SECRET_FILE: LIGHTSERP_KEYCLOAK_CLIENT_SECRET_FILE
    ports:
    - 127.0.0.1:8000:3000
    networks:
    - iacgenie-frontend
    - iacgenie-backend
    - iacgenie-messaging
    depends_on:
    - minio
    - nsqd
    - searxng
    - openbao
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    volumes:
    - ../ansible/roles/openbao/files/inject-secrets.sh:/usr/local/bin/inject-secrets.sh:ro
    - ../ansible/roles/openbao/files/openbao_injector.py:/usr/local/bin/openbao_injector.py:ro
    - ../ansible/roles/openbao/files/configs:/etc/openbao-config:ro
    - openbao-approle:/var/run/approle
    entrypoint:
    - /usr/local/bin/inject-secrets.sh
    - lightserp-api
    - --
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    secrets:
    - lightserp_api_secret
    - lightserp_database_url
    - lightserp_keycloak_client_secret
    - lightserp_minio_secret_key
    - lightserp_redis_password
  lightserp-webui:
    image: lightserp-lightserp-webui:latest
    container_name: iacgenie_lightserp_webui
    restart: unless-stopped
    ports:
    - 127.0.0.1:3001:3070
    networks:
    - iacgenie-frontend
    depends_on:
    - lightserp-api
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:3070/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cap_add: []
  searxng:
    image: searxng/searxng:latest
    container_name: iacgenie_searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY}
      SEARXNG_BASE_URL: http://search.iacgenie.com
    ports:
    - 127.0.0.1:8082:8080
    networks:
    - iacgenie-frontend
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: []
    volumes:
    - /home/mkanavi/docker/iacgenie/data/searxng:/etc/searxng
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
  nsqd:
    image: nsqio/nsq:latest
    container_name: iacgenie_nsqd
    restart: unless-stopped
    command: nsqd --data-path=/nsq/data
    volumes:
    - /home/mkanavi/docker/iacgenie/data/nsqd:/nsq/data
    ports:
    - 127.0.0.1:4150:4150
    - 127.0.0.1:4151:4151
    networks:
    - iacgenie-messaging
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:4151/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    cap_add: []
  pagezen:
    image: lightserp-pagezen:latest
    container_name: iacgenie_pagezen
    restart: unless-stopped
    environment:
      LIGHTSERP_API_URL: http://lightserp-api:8000
      LIGHTSERP_API_SECRET: ${LIGHTSERP_API_SECRET}
    ports:
    - 127.0.0.1:8081:8082
    networks:
    - iacgenie-frontend
    depends_on:
    - lightserp-api
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:8082/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cap_add: []
  iacgenie-backend:
    image: iacgenie-backend:latest
    container_name: iacgenie_backend
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      NSQD_ADDR: nsqd:4150
      OPENBAO_ADDR: http://openbao:8200
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: iacgenie
      KEYCLOAK_CLIENT_ID: iacgenie-platform
      JWT_SECRET: ${IACGENIE_JWT_SECRET}
      APP_ENV: production
    ports:
    - 127.0.0.1:3003:8000
    networks:
    - iacgenie-backend
    depends_on:
    - postgres
    - minio
    - redis
    - nsqd
    - keycloak
    - openbao
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    volumes:
    - ../ansible/roles/openbao/files/inject-secrets.sh:/usr/local/bin/inject-secrets.sh:ro
    - ../ansible/roles/openbao/files/openbao_injector.py:/usr/local/bin/openbao_injector.py:ro
    - ../ansible/roles/openbao/files/configs:/etc/openbao-config:ro
    - openbao-approle:/var/run/approle
    entrypoint:
    - /usr/local/bin/inject-secrets.sh
    - iacgenie-backend
    - --
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:8000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cap_add: []
  iacgenie-frontend:
    image: iacgenie-frontend:latest
    container_name: iacgenie_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3003
      NEXT_PUBLIC_PLATFORM_URL: https://platform.iacgenie.com
    ports:
    - 127.0.0.1:3002:80
    networks:
    - iacgenie-frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: []
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:3002/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  grafana:
    image: grafana/grafana:latest
    container_name: iacgenie_grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3004
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
    - 127.0.0.1:3004:3000
    volumes:
    - /home/mkanavi/docker/iacgenie/data/grafana:/var/lib/grafana
    networks:
    - iacgenie-frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: []
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  prometheus:
    image: prom/prometheus:latest
    container_name: iacgenie_prometheus
    restart: unless-stopped
    volumes:
    - /home/mkanavi/docker/iacgenie/data/prometheus:/prometheus
    ports:
    - 127.0.0.1:9090:9090
    networks:
    - iacgenie-frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:9090/-/healthy || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cap_add: []
  cloudflared:
    image: cloudflare/cloudflared:2024.12.0
    container_name: iacgenie_cloudflared
    restart: unless-stopped
    command:
    - tunnel
    - --config
    - /etc/cloudflared/config.yml
    - run
    volumes:
    - ./cloudflared/auth.json:/etc/cloudflared/cert.json:ro
    - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:4000/ready || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    - /etc/cloudflared:noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
  clamav-backend:
    image: rguziy/clamav-web-client:latest
    container_name: iacgenie_clamav
    restart: unless-stopped
    ports:
    - 127.0.0.1:9092:80
    networks:
    - iacgenie-frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:9092/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cap_add: []
  crowdsec-backend:
    image: crowdsecurity/crowdsec:latest
    container_name: iacgenie_crowdsec
    restart: unless-stopped
    ports:
    - 127.0.0.1:3033:8080
    volumes:
    - /var/log/nginx:/var/log/nginx:ro
    - /home/mkanavi/docker/iacgenie/data/crowdsec-db:/var/lib/crowdsec/data
    - /home/mkanavi/docker/iacgenie/data/crowdsec-config:/etc/crowdsec
    networks:
    - iacgenie-frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: []
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:3033/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  pagegen:
    image: lightserp-pagegen:latest
    container_name: iacgenie_pagegen
    restart: unless-stopped
    environment:
      LIGHTSERP_API_URL: http://lightserp-api:8000
      LIGHTSERP_API_SECRET: ${LIGHTSERP_API_SECRET}
    ports:
    - 127.0.0.1:3032:3031
    networks:
    - iacgenie-frontend
    depends_on:
    - lightserp-api
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:3031/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    cap_add: []
  searxng-backend:
    image: searxng/searxng:latest
    container_name: iacgenie_searxng_backend
    restart: unless-stopped
    ports:
    - 127.0.0.1:8084:8080
    networks:
    - iacgenie-frontend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
          pids: 100
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: []
    volumes:
    - /home/mkanavi/docker/iacgenie/data/searxng:/etc/searxng
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  auth-wrapper:
    image: iacgenie/auth-wrapper:v1.4.2
    container_name: iacgenie_auth_wrapper
    restart: unless-stopped
    ports:
    - 127.0.0.1:9091:9096
    environment:
      PORT: 9096
      KEYCLOAK_URL: https://auth.iacgenie.com
      KEYCLOAK_REALM: iacgenie
      KEYCLOAK_CLIENT_ID: auth-wrapper
      KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/auth_wrapper_kc_secret
      SESSION_SECRET_FILE: /run/secrets/auth_wrapper_session_secret
      SERVICE_NAME: Auth-Wrapper
      SERVICE_TITLE: IaCGenie Services
      SERVICE_BACKENDS: clamav:9092,pagegen:3032,crowdsec:3033,searxng:8084,resume:3006,default:9090
      INSECURE_SKIP_VERIFY: 'false'
    secrets:
    - auth_wrapper_kc_secret
    - auth_wrapper_session_secret
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:9096/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
          pids: 500
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add: []

  # =====================
  # Resume Platform API (FastAPI)
  # =====================
  resume-api:
    build:
      context: ../..
      dockerfile: resume-platform/api/Dockerfile
    container_name: iacgenie_resume_api
    restart: unless-stopped
    ports:
    - 127.0.0.1:3006:3006
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=iacgenie
      - KEYCLOAK_CLIENT_ID=resume-platform
      - KEYCLOAK_CLIENT_SECRET=${RESUME_PLATFORM_CLIENT_SECRET}
      - AUTH_WRAPPER_URL=http://auth-wrapper:9096
      - OLLAMA_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
      - API_SECRET=${RESUME_API_SECRET}
      - MAX_FILE_SIZE_MB=10
      - ALLOWED_ORIGINS=https://resume.iacgenie.com
    depends_on:
    - postgres
    - minio
    - keycloak
    networks:
    - iacgenie-backend
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3006/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # =====================
  # n8n Workflow Engine
  # =====================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: iacgenie_n8n
    restart: unless-stopped
    ports:
    - 127.0.0.1:3005:5678
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_PORT=5432
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - OLLAMA_URL=http://127.0.0.1:11434
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - N8N_API_KEY=${RESUME_API_SECRET}
    volumes:
    - /home/mkanavi/docker/iacgenie/data/n8n:/home/node/.n8n
    depends_on:
    - postgres
    - redis
    - minio
    networks:
    - iacgenie-backend
    deploy:
      resources:
        limits:
          memory: "1g"
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "exec 6<>/dev/tcp/127.0.0.1:5678 && exec 6>&-"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  iacgenie-frontend:
    driver: bridge
  iacgenie-backend:
    driver: bridge
  iacgenie-messaging:
    driver: bridge
volumes:
  openbao-appprope: null
