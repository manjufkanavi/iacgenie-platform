# Redis Security Configuration
# Supplemental to the existing redis-server command
# Apply via redis.conf or additional config file

# Disable dangerous commands in production
# Note: These are disabled via the main docker-compose command,
# but documented here for reference:
#
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
# rename-command CONFIG ""
# rename-command KEYS ""
# rename-command SHUTDOWN ""

# Requirepass is set via docker-compose environment variable
# Protected mode is enabled by default
