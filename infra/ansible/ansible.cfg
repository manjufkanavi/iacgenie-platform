# ansible.cfg
[defaults]
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
stderr_callback = skip
roles_path = ./roles
collections_path = ./collections
inventory = ./inventory/hosts.ini
forks = 10
timeout = 30
vault_password_file = ./.vault_key

[ssh_connection]
pipelining = True
# ServerAliveInterval/CountMax: detect dead connections quickly instead of hanging.
# ControlPersist=30s: short enough to avoid stale socket issues on the VM.
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=10 -o TCPKeepAlive=yes
control_path_dir = ~/.ansible/cp
# Retry SSH connection once before failing (handles transient sshd restarts)
retries = 1

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

