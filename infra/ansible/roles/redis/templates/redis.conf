# Redis 7 configuration — rendered for deployment
# Managed by Ansible — hardened for production
bind 127.0.0.1
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300
protected-mode yes
databases 16

# TLS/SSL
tls-port 6380
tls-cert-file /etc/redis/tls/server.crt
tls-key-file /etc/redis/tls/server.key
tls-ca-cert-file /etc/redis/tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphers HIGH:!aNULL:!MD5:!3DES
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
tls-prefer-server-ciphers yes

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence — AOF + RDB
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ACL — Separate users per service
user default on >CHANGE_ME_IN_VAULT ~* &* +@all
user iacgenie-app on >CHANGE_ME_IN_VAULT ~iacgenie:* &* +@read +@write +@connection +@admin
user lightserp-app on >CHANGE_ME_IN_VAULT ~lightserp:* &* +@read +@write +@connection +@admin
user backup-user on >CHANGE_ME_IN_VAULT ~* &* +@read +@write

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Logging
loglevel notice
logfile ""

# Connection limits
maxclients 10000

# Security — disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
