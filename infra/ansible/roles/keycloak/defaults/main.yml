keycloak_version: "26.0"
keycloak_port: 8083
keycloak_admin_user: admin
keycloak_admin_password: "{{ keycloak_pass | default('CHANGE_ME_IN_VAULT') }}"
keycloak_realm: iacgenie
keycloak_db_host: postgres
keycloak_db_port: 5432
keycloak_db_name: keycloak
keycloak_admin_url: "http://127.0.0.1:{{ keycloak_port }}"

# LightSerp realm clients (Keycloak admin API on port 9003)
lightserp_realm_enabled: true
lightserp_clients:
  lightserp-webui:
    secret: "{{ lightserp_webui_secret }}"
    redirect_uris:
      - "https://lightserp.iacgenie.com/*"
      - "https://app.iacgenie.com/*"
  lightserp-api:
    secret: "{{ lightserp_api_secret }}"
    redirect_uris:
      - "https://api.iacgenie.com/*"
  openbao-oidc:
    secret: "{{ openbao_oidc_secret }}"
    redirect_uris:
      - "https://vault.iacgenie.com/*"

# iacGenie realm clients
iacgenie_clients:
  iacgenie-platform:
    secret: "{{ iacgenie_platform_secret }}"
    redirect_uris:
      - "https://admin.iacgenie.com/*"
      - "https://iacgenie.com/*"
  gitea:
    secret: "{{ gitea_secret }}"
    redirect_uris:
      - "https://gitea.iacgenie.com/user/oauth2/gitea"
  searxng:
    secret: "{{ searxng_secret }}"
    redirect_uris:
      - "https://search.iacgenie.com/*"
  auth-wrapper:
    secret: "{{ auth_wrapper_secret }}"
    redirect_uris:
      - "https://clamav.iacgenie.com/*"
      - "https://crowdsec.iacgenie.com/*"
      - "https://pagegen.iacgenie.com/*"

# Keycloak roles
keycloak_roles:
  - platform-admin
  - openbao-admin
  - project-admin
  - project-member
  - openbao-service-read
