    status_code: 200
    validate_certs: no
  when: openbao_root_token is defined

- name: "OpenBao Secrets | Seed SMTP credentials"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/smtp"
    method: POST
    body_format: json
    body:
      data:
        SMTP_ADDR: "{{ smtp_addr | default('mail.smtp2go.com') }}"
        SMTP_PORT: "{{ smtp_port | default('587') }}"
        SMTP_USER: "{{ smtp_user | default('') }}"
        SMTP_PASS: "{{ smtp_pass | default('') }}"
        SMTP_FROM: "{{ smtp_from | default('noreply@iacgenie.com') }}"
    headers:
      X-Vault-Token: "{{ openbao_admin_token | default(openbao_root_token) }}"
    status_code: 200
    validate_certs: no
  when: openbao_root_token is defined

# =====================
# Step 5: Report seeded secrets
# =====================
- name: "OpenBao Secrets | List KV paths"
  ansible.builtin.command: docker exec iacgenie_openbao bao secrets list iacgenie/kv/
  register: _kv_paths
  changed_when: false
  when: openbao_root_token is defined

- name: "OpenBao Secrets | Report"
  ansible.builtin.debug:
    var: _kv_paths.stdout_lines
  when: openbao_root_token is defined and _kv_paths.stdout_lines is defined
