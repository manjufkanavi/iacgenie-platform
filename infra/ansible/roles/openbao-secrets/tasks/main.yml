- name: "OpenBao Secrets | Seed Gitea admin credentials"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/gitea_admin"
    method: POST
    body_format: json
    body:
      data:
        GITEA_ADMIN_USERNAME: "admin"
        GITEA_ADMIN_PASSWORD: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    headers:
      X-Vault-Token: "{{ openbao_admin_token | default(openbao_root_token) }}"
    status_code: 200
    validate_certs: no
  when: openbao_root_token is defined

- name: "OpenBao Secrets | Seed LightSerp credentials"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/lightserp"
    method: POST
    body_format: json
    body:
      data:
        LIGHTSERP_API_SECRET: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
        LIGHTSERP_DATABASE_URL: "postgresql://iacgenie_pg:***@postgres:5432/iacgenie"
        LIGHTSERP_KEYCLOAK_CLIENT_SECRET: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    headers:
      X-Vault-Token: "{{ openbao_admin_token | default(openbao_root_token) }}"
    status_code: 200
    validate_certs: no
