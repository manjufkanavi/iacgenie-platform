- name: "OpenBao Secrets | Seed NSQD credentials"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/nsqd"
    method: POST
    body_format: json
    body:
      data:
        NSQD_AUTH_PASSWORD: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits,length=32')) }}"
    headers:
