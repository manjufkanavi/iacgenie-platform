- name: "OpenBao Secrets | Seed JWT secrets"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/jwt"
    method: POST
    body_format: json
    body:
      data:
        IACGENIE_JWT_SECRET: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits length=48')) }}"
        AUTH_WRAPPER_SESSION_SECRET: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    headers:
      X-Vault-Token: "{{ openbao_admin_token | default(openbao_root_token) }}"
    status_code: 200
    validate_certs: no
  when: openbao_root_token is defined

- name: "OpenBao Secrets | Seed Cloudflare tunnel token"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/cloudflare"
    method: POST
    body_format: json
    body:
      data:
        CLOUDFLARE_TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    headers:
