- name: "OpenBao Secrets | Seed Gitea DB credentials"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/gitea_db"
    method: POST
    body_format: json
    body:
      data:
        GITEA_DB_PASSWORD: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    headers:
      X-Vault-Token: "{{ openbao_admin_token | default(openbao_root_token) }}"
    status_code: 200
