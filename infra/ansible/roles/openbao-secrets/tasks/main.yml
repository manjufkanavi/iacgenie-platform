- name: "OpenBao Secrets | Seed Keycloak DB credentials"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/keycloak_db"
    method: POST
    body_format: json
    body:
      data:
        KC_DB_PASSWORD: "{{ (lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
        KC_DB_HOST: "postgres"
        KC_DB_PORT: "5432"
        KC_DB_NAME: "keycloak"
    headers:
      X-Vault-Token: "{{ openbao_admin_token | default(openbao_root_token) }}"
    status_code: 200
    validate_certs: no
