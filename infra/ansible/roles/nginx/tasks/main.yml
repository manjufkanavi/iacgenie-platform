---
# =============================================================================
# Nginx role - Main entry point
# Deploy unified reverse proxy config with security headers
# Nginx runs as Docker container (iacgenie-nginx) in host network mode
# Config files are written to host paths and mounted into container
# =============================================================================

- name: "Nginx | Deploy Nginx main configuration"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: "Nginx | Deploy reverse proxy configuration (unified)"
  ansible.builtin.template:
    src: reverse-proxy.conf.j2
    dest: /etc/nginx/conf.d/iacgenie.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: "Nginx | Remove stale vault-iacgenie vHost (now in unified conf)"
  ansible.builtin.file:
    path: /etc/nginx/conf.d/vault-iacgenie.conf
    state: absent
  notify: Restart nginx

- name: "Nginx | Remove stale unified config files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/iacgenie-unified.conf
    - /etc/nginx/conf.d/iacgenie-unified.conf.bak
    - /etc/nginx/conf.d/iacgenie-unified.conf.bak.*
  notify: Restart nginx

- name: "Nginx | Test configuration"
  ansible.builtin.command: nginx -t
  changed_when: false
  failed_when: false
