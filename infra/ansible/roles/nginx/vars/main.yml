---
# Nginx Role Vars
# Phase 10.8: Security headers + TLS automation

nginx_version: "1.27"
nginx_config_dir: /etc/nginx
nginx_conf_file: "{{ nginx_config_dir }}/nginx.conf"
nginx_site_conf: "{{ nginx_config_dir }}/nginx.conf"
nginx_sites_enabled: "{{ nginx_config_dir }}/sites-enabled"
nginx_ssl_dir: /etc/nginx/ssl

# Phase 10.20: TLS/Certbot
tls_enabled: true
use_letsencrypt: false
certbot_enabled: false
certbot_email: admin@iacgenie.com
certbot_domains: []
certbot_challenge: dns

# Phase 10.8: Security headers
security_headers:
  strict_transport_security: "max-age=63072000; includeSubDomains; preload"
  x_frame_options: "DENY"
  x_content_type_options: "nosniff"
  x_xss_protection: "1; mode=block"
  referrer_policy: "strict-origin-when-cross-origin"
  content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';"
  permissions_policy: "camera=(), microphone=(), geolocation=(), payment=()"
  cross_origin_embedder_policy: "require-corp"
  cross_origin_opener_policy: "same-origin"
  cross_origin_resource_policy: "same-origin"

# Rate limiting
rate_limit_general: 10
rate_limit_auth: 3
rate_limit_api: 30

# Reverse proxy backends
nginx_backends:
  - name: iacgenie.local
    server_name: "iacgenie.local"
    proxy_pass: "http://127.0.0.1:5173"
    required_role: null

  - name: lightsrp.local
    server_name: "lightsrp.local"
    proxy_pass: "http://127.0.0.1:3070"
    required_role: null

  - name: infra.local
    server_name: "infra.local"
    locations:
      - path: /grafana/
        proxy_pass: "http://127.0.0.1:3001"
      - path: /prometheus/
        proxy_pass: "http://127.0.0.1:9090"
      - path: /minio/
        proxy_pass: "http://127.0.0.1:9001"
      - path: /keycloak/
        proxy_pass: "http://127.0.0.1:8080"
