---
# MinIO role - Main entry point
- name: "MinIO | Create data directory"
  ansible.builtin.file:
    path: "{{ minio_data_dir | default('/var/lib/minio') }}"
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: "MinIO | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/docker/iacgenie/.env.minio
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Reload docker compose

- name: "MinIO | Verify MinIO container is running"
  ansible.builtin.command: docker ps -a --filter "name=iacgenie-minio" --format "{{ '{{.Names}}' }}"
  register: minio_status
  changed_when: false
  failed_when: false

- name: "MinIO | Show MinIO status"
  ansible.builtin.debug:
    var: minio_status.stdout_lines | default(['N/A - managed by docker-compose-generator'])
