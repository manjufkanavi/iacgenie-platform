---
# Docker Compose Generator - Generate compose file
- name: "Compose Gen | Ensure base directory exists"
  ansible.builtin.file:
    path: /home/mkanavi/docker/iacgenie
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0755"

- name: "Compose Gen | Ensure data directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0755"
  loop:
    - /home/mkanavi/docker/iacgenie/data/postgres
    - /home/mkanavi/docker/iacgenie/data/redis
    - /home/mkanavi/docker/iacgenie/data/minio
    - /home/mkanavi/docker/iacgenie/data/openbao
    - /home/mkanavi/docker/iacgenie/data/keycloak
    - /home/mkanavi/docker/iacgenie/data/gitea
    - /home/mkanavi/docker/iacgenie/data/nsqd
    - /home/mkanavi/docker/iacgenie/data/grafana
    - /home/mkanavi/docker/iacgenie/data/prometheus
    - /home/mkanavi/docker/iacgenie/data/crowdsec-db
    - /home/mkanavi/docker/iacgenie/data/crowdsec-config
    - /home/mkanavi/docker/iacgenie/loki
    - /home/mkanavi/docker/iacgenie/promtail
    # OpenBao raft data directory — contains vault.db, raft/, certs, HCL
    - /home/mkanavi/docker/iacgenie/openbao_raft

- name: "Compose Gen | Fix data directory permissions"
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: true
    owner: mkanavi
    group: mkanavi
    mode: "0700"
  loop:
    - /home/mkanavi/docker/iacgenie/data/postgres
    - /home/mkanavi/docker/iacgenie/data/redis
    - /home/mkanavi/docker/iacgenie/data/minio
    - /home/mkanavi/docker/iacgenie/data/nsqd
    - /home/mkanavi/docker/iacgenie/data/grafana
    - /home/mkanavi/docker/iacgenie/data/prometheus

- name: "Compose Gen | Fix OpenBao raft data ownership (keys/raft data are sensitive)"
  ansible.builtin.file:
    path: /home/mkanavi/docker/iacgenie/openbao_raft
    owner: mkanavi
    group: mkanavi
    mode: "0750"
    recurse: true

- name: "Compose Gen | Fix OpenBao storage data permissions"
  ansible.builtin.file:
    path: /home/mkanavi/docker/iacgenie/data/openbao
    owner: mkanavi
    group: mkanavi
    mode: "0755"
    recurse: true

- name: "Compose Gen | Render docker-compose template"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/mkanavi/docker/iacgenie/docker-compose.yml
    owner: mkanavi
    group: mkanavi
    mode: "0644"
  notify: Reload docker compose

- name: "Compose Gen | Verify compose file syntax"
  ansible.builtin.command: docker compose -f /home/mkanavi/docker/iacgenie/docker-compose.yml config
  changed_when: false
  register: compose_check
  failed_when: false
  when: docker_compose_project is defined

- name: "Compose Gen | Show compose file location"
  ansible.builtin.debug:
    msg: "docker-compose.yml deployed to /home/mkanavi/docker/iacgenie/"
- name: "Compose Gen | Fix SearXNG data ownership (UID 977)"
  ansible.builtin.file:
    path: /home/mkanavi/docker/iacgenie/data/searxng
    owner: "977"
    group: "977"
    mode: "0755"
    recurse: true

- name: "Compose Gen | Create PgBouncer config directory"
  ansible.builtin.file:
    path: /home/mkanavi/docker/iacgenie/pgbouncer
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0755"

- name: "Compose Gen | Deploy PgBouncer config"
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: /home/mkanavi/docker/iacgenie/pgbouncer/pgbouncer.ini
    owner: mkanavi
    group: mkanavi
    mode: "0644"
  notify: Reload docker compose

- name: "Compose Gen | Create postgres_exporter config directory"
  ansible.builtin.file:
    path: /home/mkanavi/docker/iacgenie/postgres_exporter
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0755"

- name: "Compose Gen | Deploy postgres_exporter metrics config"
  ansible.builtin.template:
    src: postgres_exporter.yml.j2
    dest: /home/mkanavi/docker/iacgenie/postgres_exporter/metrics.yml
    owner: mkanavi
    group: mkanavi
    mode: "0644"
  notify: Reload docker compose
