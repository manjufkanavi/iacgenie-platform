---
# Docker Compose Generator - Network setup
# Docker Compose manages its own networks automatically.
# The compose project 'iacgenie' creates: iacgenie_iacgenie-backend, iacgenie_iacgenie-frontend, etc.
# No manual network creation needed — Docker Compose handles it.

- name: "Compose Gen | Check if Docker networks exist"
  ansible.builtin.command: "docker network inspect iacgenie_iacgenie-backend"
  register: _net_check
  changed_when: false
  failed_when: false

- name: "Compose Gen | Network status"
  ansible.builtin.debug:
    msg: "Docker networks managed by compose project 'iacgenie' (iacgenie_iacgenie-backend, etc.)"
