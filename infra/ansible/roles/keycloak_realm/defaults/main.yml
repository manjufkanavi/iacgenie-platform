# Keycloak Realm Role — Defaults (Phase 10.3: Multi-Tenant & RBAC)

# Admin connection
keycloak_admin_url: "http://127.0.0.1:8080"
keycloak_admin_user: admin
keycloak_admin_password: "{{ keycloak_admin_password | default('CHANGE_ME_IN_VAULT') }}"
keycloak_provision_realm: true
keycloak_wait_retries: 30
keycloak_wait_delay: 5

# Multi-tenant realms
keycloak_realms:
  - name: iacgenie
    displayName: "IacGenie Platform"
    enabled: true
    registrationEmailAsUsername: false
    rememberMe: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    sslRequired: "external"
    roles:
      realm:
        - name: platform-admin
          description: "Full platform administrator — access all projects"
          composite: false
        - name: project-admin
          description: "Project-level administrator — manage own project members"
          composite: false
        - name: project-member
          description: "Project read-only member"
          composite: false
      client:
        iacgenie-platform:
          - name: gateway-admin
            description: "Admin access to admin gateway"
        lightserp-api:
          - name: api-user
            description: "LightSerp API access"
    defaultRoles:
      - project-member
      - offline_access

# ── LightSerp Realm (Phase 10.3: Multi-Tenant & RBAC) ──────────────────────
lightserp_realm_enabled: true
lightserp_realms:
  - name: lightserp
    displayName: "LightSerp Platform"
    enabled: true
    registrationEmailAsUsername: false
    rememberMe: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    sslRequired: "external"
    roles:
      realm:
        - name: platform-admin
          description: "Full platform administrator — access all projects"
          composite: false
        - name: openbao-admin
          description: "OpenBao vault administrator"
          composite: false
        - name: project-admin
          description: "Project-level administrator — manage own project members"
          composite: false
        - name: project-member
          description: "Project read-only member"
          composite: false
        - name: openbao-service-read
          description: "Read-only OpenBao service access"
          composite: false
      client:
        lightserp-webui:
          - name: web-user
            description: "WebUI user access"
        lightserp-api:
          - name: api-user
            description: "LightSerp API access"
    defaultRoles:
      - project-member
      - offline_access

# LightSerp clients (lightserp realm)
lightserp_clients:
  - client_id: lightserp-webui
    name: "LightSerp WebUI"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://lightserp.iacgenie.com/*"
      - "https://app.iacgenie.com/*"
    webOrigins:
      - "https://lightserp.iacgenie.com"
      - "https://app.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list
      - profile
      - email

  - client_id: lightserp-api
    name: "LightSerp API"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://api.iacgenie.com/*"
    webOrigins:
      - "https://api.iacgenie.com"
      - "+"
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: true
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

  - client_id: openbao-oidc
    name: "OpenBao OIDC"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://vault.iacgenie.com/*"
    webOrigins:
      - "https://vault.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

# Clients to register (Phase 10.16)
keycloak_clients:
  - client_id: iacgenie-platform
    name: "IacGenie Admin Dashboard"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://admin.iacgenie.com/*"
      - "https://iacgenie.com/*"
    webOrigins:
      - "https://admin.iacgenie.com"
      - "https://iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list
      - project-info

  - client_id: lightserp-api
    name: "LightSerp API"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "http://localhost:3071/*"
      - "https://lightserp.iacgenie.com/*"
    webOrigins:
      - "https://lightserp.iacgenie.com"
      - "+"
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

  - client_id: gitea
    name: "Gitea SSO"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://gitea.iacgenie.com/user/oauth2/gitea"
    webOrigins:
      - "https://gitea.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

  - client_id: searxng
    name: "SearXNG Search"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://search.iacgenie.com/*"
    webOrigins:
      - "https://search.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list
