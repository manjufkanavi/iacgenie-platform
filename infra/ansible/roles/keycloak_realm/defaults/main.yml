    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

  - client_id: gitea
    name: "Gitea SSO"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://gitea.iacgenie.com/user/oauth2/gitea"
    webOrigins:
      - "https://gitea.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

  - client_id: searxng
    name: "SearXNG Search"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://search.iacgenie.com/*"
    webOrigins:
      - "https://search.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

  - client_id: auth-wrapper
    name: "Auth Wrapper (Dashboards)"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://clamav.iacgenie.com/callback"
      - "https://clamav.iacgenie.com/*"
      - "https://pagegen.iacgenie.com/callback"
      - "https://pagegen.iacgenie.com/*"
      - "https://crowdsec.iacgenie.com/callback"
      - "https://crowdsec.iacgenie.com/*"
      - "https://auth.iacgenie.com/*"
    webOrigins:
      - "https://clamav.iacgenie.com"
      - "https://pagegen.iacgenie.com"
      - "https://crowdsec.iacgenie.com"
      - "https://auth.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list
      - profile
      - email

  # ── Resume Platform (Phase AUTH-0) ───────────────────────
  - client_id: resume-platform
    name: "Resume Platform Client"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://resume.iacgenie.com/*"
      - "http://localhost:3070/*"
    webOrigins:
      - "+https://resume.iacgenie.com"
      - "+http://localhost:3070"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list
