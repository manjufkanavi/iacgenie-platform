# Keycloak Realm Role — Defaults (Phase 10.3: Multi-Tenant & RBAC)

# Admin connection
keycloak_admin_url: "http://127.0.0.1:{{ keycloak_port }}"
keycloak_admin_user: admin
keycloak_admin_password: ""
keycloak_provision_realm: true
keycloak_wait_retries: 30
keycloak_wait_delay: 5

# Multi-tenant realms
keycloak_realms:
  - name: iacgenie
    displayName: "IacGenie Platform"
    enabled: true
    registrationAllowed: false
    registrationEmailAsUsername: false
    rememberMe: true
    verifyEmail: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: false
    sslRequired: "external"
    # ── Brute-force protection ──
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 10
    maxTemporaryLockouts: 0
    maxFailureWaitSeconds: 900
    minimumQuickLoginWaitSeconds: 900
    waitIncrementMinutes: 60
    quickLoginCheckMilliSeconds: 30000
    # ── Session settings ──
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    offlineSessionIdleTimeout: 2592000
    clientSessionIdleTimeout: 1800
    clientSessionMaxLifespan: 36000
    accessTokenLifespan: 300
    accessTokenLifespanForImplicitFlow: 900
    refreshTokenMaxReuse: 0
    maxSessions: -1
    # ── Event logging ──
    eventsEnabled: true
    eventsExpiration: 0
    eventsListeners:
      - jboss-logging
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true
    # ── OTP / MFA ──
    otpPolicyPeriod: 30
    otpPolicyDigits: 6
    otpPolicyType: "totp"
    otpPolicyAlgorithm: "HmacSHA1"
    otpPolicyTemporary: false
    roles:
      realm:
        - name: platform-admin
          description: "Full platform administrator — access all projects"
          composite: false
        - name: project-admin
          description: "Project-level administrator — manage own project members"
          composite: false
        - name: project-member
          description: "Project read-only member"
          composite: false
      client:
        iacgenie-platform:
          - name: gateway-admin
            description: "Admin access to admin gateway"
        lightserp-api:
          - name: api-user
            description: "LightSerp API access"
    defaultRoles:
      - project-member
      - offline_access

# ── LightSerp Realm (Phase 10.3: Multi-Tenant & RBAC) ──────────────────────
lightserp_realm_enabled: true
lightserp_realms:
  - name: lightserp
    displayName: "LightSerp Platform"
    enabled: true
    registrationAllowed: false
    registrationEmailAsUsername: false
    rememberMe: true
    verifyEmail: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    editUsernameAllowed: false
    sslRequired: "external"
    # ── Brute-force protection ──
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 10
    maxTemporaryLockouts: 0
    maxFailureWaitSeconds: 900
    minimumQuickLoginWaitSeconds: 900
    waitIncrementMinutes: 60
    quickLoginCheckMilliSeconds: 30000
    # ── Session settings ──
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    offlineSessionIdleTimeout: 2592000
    clientSessionIdleTimeout: 1800
    clientSessionMaxLifespan: 36000
    accessTokenLifespan: 300
    accessTokenLifespanForImplicitFlow: 900
    refreshTokenMaxReuse: 0
    maxSessions: -1
    # ── Event logging ──
    eventsEnabled: true
    eventsExpiration: 0
    eventsListeners:
      - jboss-logging
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true
    # ── OTP / MFA ──
    otpPolicyPeriod: 30
    otpPolicyDigits: 6
    otpPolicyType: "totp"
    otpPolicyAlgorithm: "HmacSHA1"
    otpPolicyTemporary: false
    roles:
      realm:
        - name: platform-admin
          description: "Full platform administrator — access all projects"
          composite: false
        - name: openbao-admin
          description: "OpenBao vault administrator"
          composite: false
        - name: project-admin
          description: "Project-level administrator — manage own project members"
          composite: false
        - name: project-member
          description: "Project read-only member"
          composite: false
        - name: openbao-service-read
          description: "Read-only OpenBao service access"
          composite: false
      client:
        lightserp-webui:
          - name: web-user
            description: "WebUI user access"
        lightserp-api:
          - name: api-user
            description: "LightSerp API access"
    defaultRoles:
      - project-member
      - offline_access

# LightSerp clients (lightserp realm)
lightserp_clients:
  - client_id: lightserp-webui
    name: "LightSerp WebUI"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://lightserp.iacgenie.com/*"
      - "https://app.iacgenie.com/*"
    webOrigins:
      - "https://lightserp.iacgenie.com"
      - "https://app.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list
      - profile
      - email

  - client_id: lightserp-api
    name: "LightSerp API"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://api.iacgenie.com/*"
    webOrigins:
      - "https://api.iacgenie.com"
      - "+"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

  - client_id: openbao-oidc
    name: "OpenBao OIDC"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://vault.iacgenie.com/*"
    webOrigins:
      - "https://vault.iacgenie.com"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    consentRequired: false
    protocol: openid-connect
    defaultClientScopes:
      - web-origins
      - role_list

# Clients to register (Phase 10.16)
keycloak_clients:
  - client_id: iacgenie-platform
    name: "IacGenie Admin Dashboard"
    enabled: true
    clientAuthenticatorType: client-secret
    redirectUris:
      - "https://admin.iacgenie.com/*"
      - "https://iacgenie.com/*"
    webOrigins:
