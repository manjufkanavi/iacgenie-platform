---
# Phase 10.3: Multi-Tenant & RBAC — Keycloak Realm Provisioning
# Task 10.11: Keycloak multi-tenant realm
# Task 10.16: Keycloak client registration

- name: "10.11 | Keycloak | Wait for Keycloak to be ready"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/health/ready"
    method: GET
    status_code: [200, 503]
  register: kc_health
  retries: 30
  delay: 5
  changed_when: false
  until: (kc_health.status | default(0)) == 200

- name: "10.11 | Keycloak | Get admin token"
  ansible.builtin.command:
    cmd: >
      curl -s -X POST
      "http://127.0.0.1:8080/admin/realms/master/protocol/openid-connect/token"
      -d "grant_type=password"
      -d "username={{ keycloak_admin_user }}"
      -d "password={{ keycloak_admin_password }}"
      -d "client_id=admin-cli"
  changed_when: false
  register: kc_token_raw
  when: keycloak_admin_password | default('') | length > 0

- name: "10.11 | Keycloak | Set admin token"
  ansible.builtin.set_fact:
    kc_admin_token: "{{ kc_token_raw.stdout | json_query('access_token') }}"
  when:
    - keycloak_admin_password | default('') | length > 0
    - kc_token_raw is succeeded

# Process each realm
- name: "10.11 | Keycloak | Check realm existence"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/admin/realms/{{ item.name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
    status_code: [200, 404]
  loop: "{{ keycloak_realms }}"
  loop_control:
    label: "{{ item.name }}"
  register: kc_realm_check
  changed_when: false
  when: keycloak_admin_password | default('') | length > 0

- name: "10.11 | Keycloak | Create realms that don't exist"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/admin/realms"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ item.item }}"
    status_code: [201, 409]
  loop: "{{ kc_realm_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.status | default(0)) == 404
    - keycloak_admin_password | default('') | length > 0
  changed_when: true

# Get realm ID for role/claim creation
- name: "10.11 | Keycloak | Get iacgenie realm ID"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/admin/realms/iacgenie"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
    status_code: [200, 404]
  register: iacgenie_realm_info
  changed_when: false
  when: keycloak_admin_password | default('') | length > 0

- name: "10.11 | Keycloak | Set realm ID"
  ansible.builtin.set_fact:
    iacgenie_realm_id: "{{ iacgenie_realm_info.json.id }}"
  when:
    - (iacgenie_realm_info.status | default(0)) == 200

# Create realm roles
- name: "10.11 | Keycloak | Create realm roles"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/admin/realms/iacgenie/roles"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ item }}"
    status_code: [201, 409]
  loop: "{{ keycloak_realms | selectattr('name', 'equalto', 'iacgenie') | map(attribute='roles.realm') | first | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - iacgenie_realm_id is defined
    - keycloak_admin_password | default('') | length > 0
  changed_when: true

# Phase 10.16: Register clients
- name: "10.16 | Keycloak | Check if client exists"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/admin/realms/iacgenie/clients?search={{ item.client_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
    status_code: [200, 404]
  loop: "{{ keycloak_clients }}"
  loop_control:
    label: "{{ item.client_id }}"
  register: client_check
  changed_when: false
  when: iacgenie_realm_id is defined

- name: "10.16 | Keycloak | Register clients"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/admin/realms/iacgenie/clients"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_admin_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ item }}"
    status_code: [201, 409]
  loop: "{{ keycloak_clients }}"
  loop_control:
    label: "{{ item.client_id }}"
  register: kc_clients_created
  changed_when: true
  when: iacgenie_realm_id is defined

# Save client secrets
- name: "10.16 | Keycloak | Generate client secrets report"
  ansible.builtin.copy:
    content: |
      # Keycloak Client Secrets
      # Generated by Ansible — do not share
      {% for client in keycloak_clients %}
      Client: {{ client.client_id }}
      Redirect URIs: {{ client.redirectUris | join(', ') }}
      Service Accounts: {{ 'enabled' if client.serviceAccountsEnabled | default(false) else 'disabled' }}
      ---
      {% endfor %}
    dest: /home/mkanavi/docker/iacgenie/keycloak-client-secrets.md
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  when: iacgenie_realm_id is defined
  changed_when: true

- name: "10.11 | Keycloak | Display summary"
  ansible.builtin.debug:
    msg: >
      Keycloak multi-tenant realm setup complete.
      Realms: {{ keycloak_realms | length }}
      Clients: {{ keycloak_clients | length }}
  when: iacgenie_realm_id is defined
