---
# User management role - Main entry point
- name: "User Management | Create deploy user"
  ansible.builtin.user:
    name: "{{ deploy_username | default('deploy') }}"
    comment: "Ansible deployment user"
    shell: /bin/bash
    create_home: yes
    group: sudo
    state: present

- name: "User Management | Configure sudo access"
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ deploy_username | default('deploy') }}
    line: "{{ deploy_username | default('deploy') }} ALL=(ALL) NOPASSWD: ALL"
    owner: root
    group: root
    mode: "0440"
    create: yes
    validate: "visudo -cf %s"

- name: "User Management | Create SSH directory"
  ansible.builtin.file:
    path: "/home/{{ deploy_username | default('deploy') }}/.ssh"
    owner: "{{ deploy_username | default('deploy') }}"
    group: "{{ deploy_username | default('deploy') }}"
    mode: "0700"
    state: directory

- name: "User Management | Add SSH public keys"
  ansible.posix.authorized_key:
    user: "{{ deploy_username | default('deploy') }}"
    key: "{{ item }}"
  loop: "{{ ssh_public_keys | default([]) }}"
  when: item | length > 0 and not item.startswith('REPLACE_')

- name: "User Management | Verify user setup"
  ansible.builtin.debug:
    msg: "Deploy user {{ deploy_username | default('deploy') }} configured successfully"
