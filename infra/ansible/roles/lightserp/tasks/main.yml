---
# LightSerp role - Main entry point
# Note: Container deployment is handled by docker-compose-generator role
- name: "LightSerp | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/docker/iacgenie/.env.lightserp
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Reload docker compose

- name: "LightSerp | Verify containers are running"
  ansible.builtin.command: docker ps -a --filter "name=iacgenie-lightserp" --format "{{ '{{.Names}}' }}"
  register: lightserp_status
  changed_when: false
  failed_when: false

- name: "LightSerp | Show LightSerp status"
  ansible.builtin.debug:
    var: lightserp_status.stdout_lines | default(['N/A - managed by docker-compose-generator'])
