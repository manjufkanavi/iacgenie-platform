---
# ── PostgreSQL Configuration ────────────────────────────────────────────────
# Memory settings
pg_shared_buffers: "256MB"
pg_effective_cache_size: "1GB"
pg_work_mem: "4MB"
pg_maintenance_work_mem: "128MB"
pg_max_connections: 100
pg_data_dir: "/home/mkanavi/docker/iacgenie/data/postgres"
pg_port: 5432

# ── Database Users ───────────────────────────────────────────────────────────
# Application user (lightsrp) — used by default in docker-compose
# Additional users for multi-tenant support

# ── Multi-tenant databases (Phase 10.3) ─────────────────────────────────────
# Note: Databases are created via init scripts in docker-compose entrypoint
postgres_databases:
  - name: iacgenie
    owner: iacgenie
  - name: keycloak
    owner: keycloak
  - name: gitea
    owner: gitea
  - name: lightsrp
    owner: lightsrp

# ── Database Users ───────────────────────────────────────────────────────────
postgres_users:
  - name: iacgenie
    password: CHANGE_ME_IN_VAULT
  - name: keycloak
    password: CHANGE_ME_IN_VAULT
  - name: gitea
    password: CHANGE_ME_IN_VAULT
  - name: lightsrp
    password: CHANGE_ME_IN_VAULT
