---
# =============================================================================
# nginx-config role — tasks
# =============================================================================

- name: Stop and disable host system Nginx (Docker Nginx handles all HTTP traffic)
  ansible.builtin.systemd:
    name: nginx
    state: stopped
    enabled: false
  ignore_errors: true

- name: Ensure nginx configuration directory exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: "0755"

- name: Deploy nginx unified configuration
  ansible.builtin.template:
    src: nginx-unified.conf.j2
    dest: /etc/nginx/conf.d/iacgenie.conf
    mode: "0644"
    backup: true
  notify: reload nginx

- name: Validate full nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
