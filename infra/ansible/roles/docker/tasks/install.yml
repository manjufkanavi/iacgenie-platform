---
# Docker role - Install Docker packages
- name: "Docker | Install Docker CE packages"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: "Docker | Ensure Docker service is enabled and running"
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
