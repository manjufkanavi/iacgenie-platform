---
# Common role - Handlers
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Log ufw_status
  ansible.builtin.debug:
    msg: "UFW Status: {{ ufw_status.stdout }}"
