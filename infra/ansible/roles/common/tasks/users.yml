---
# Common role - User management
- name: "Common | Create deploy user"
  ansible.builtin.user:
    name: "{{ deploy_username | default('deploy') }}"
    comment: "Ansible deployment user"
    shell: /bin/bash
    create_home: yes
    group: sudo
    state: present

- name: "Common | Configure deploy user sudo access"
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/deploy
    line: "{{ deploy_username | default('deploy') }} ALL=(ALL) NOPASSWD: ALL"
    owner: root
    group: root
    mode: "0440"
    create: yes
    validate: "visudo -cf %s"

- name: "Common | Create .ssh directory for deploy user"
  ansible.builtin.file:
    path: "/home/{{ deploy_username | default('deploy') }}/.ssh"
    owner: "{{ deploy_username | default('deploy') }}"
    group: "{{ deploy_username | default('deploy') }}"
    mode: "0700"
    state: directory

- name: "Common | Add SSH public keys for deploy user"
  ansible.posix.authorized_key:
    user: "{{ deploy_username | default('deploy') }}"
    key: "{{ item }}"
  loop: "{{ ssh_public_keys | default([]) }}"
  when: item | length > 0 and not item.startswith('REPLACE_')

- name: "Common | Add deploy user to docker group"
  ansible.builtin.user:
    name: "{{ deploy_username | default('deploy') }}"
    groups: docker
    append: yes
  when: deploy_username | default('deploy') != 'root'
