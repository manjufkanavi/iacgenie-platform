---
# Monitoring Role — Phase 10.18
# Prometheus + Grafana dashboards for service health
# NOTE: All services are now managed by the unified docker-compose.yml.
# This role only generates configs and restarts the main compose.

- name: "10.18 | Monitoring | Ensure monitoring data directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0755"
  loop:
    - /home/mkanavi/docker/iacgenie/prometheus/data
    - /home/mkanavi/docker/iacgenie/grafana/dashboards

- name: "10.18 | Monitoring | Generate Prometheus config"
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /home/mkanavi/docker/iacgenie/prometheus/prometheus.yml
    owner: mkanavi
    group: mkanavi
    mode: "0644"
  notify: Restart main compose

- name: "10.18 | Monitoring | Generate Grafana datasources"
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /home/mkanavi/docker/iacgenie/grafana-datasources.yml
    owner: mkanavi
    group: mkanavi
    mode: "0644"
  notify: Restart main compose

- name: "10.18 | Monitoring | Generate Grafana dashboards"
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /home/mkanavi/docker/iacgenie/grafana-dashboards.yml
    owner: mkanavi
    group: mkanavi
    mode: "0644"
  notify: Restart main compose

- name: "10.18 | Monitoring | Restart main compose to pick up config changes"
  ansible.builtin.command:
    cmd: docker compose -f /home/mkanavi/docker/iacgenie/docker-compose.yml up -d prometheus grafana
  args:
    chdir: /home/mkanavi/docker/iacgenie
  changed_when: true

- name: "10.18 | Monitoring | Verify Prometheus health"
  ansible.builtin.uri:
    url: "http://127.0.0.1:9090/-/healthy"
    method: GET
    status_code: [200]
  register: prometheus_health
  retries: 10
  delay: 5
  changed_when: false
  failed_when: false

- name: "10.18 | Monitoring | Prometheus status"
  ansible.builtin.debug:
    msg: "Prometheus health: {{ prometheus_health is changed | ternary('FAILED', 'OK') }}"
