---
# Monitoring — Handler

- name: Restart prometheus
  ansible.builtin.command:
    cmd: docker compose -f /home/mkanavi/docker/iacgenie/docker-compose.yml restart prometheus
  changed_when: true

- name: Restart grafana
  ansible.builtin.command:
    cmd: docker compose -f /home/mkanavi/docker/iacgenie/docker-compose.yml restart grafana
  changed_when: true

- name: Restart main compose
  ansible.builtin.command:
    cmd: docker compose -f /home/mkanavi/docker/iacgenie/docker-compose.yml restart
  changed_when: true

- name: Start monitoring stack
  ansible.builtin.command:
    cmd: docker compose -f /home/mkanavi/docker/iacgenie/docker-compose.yml up -d
  changed_when: true
