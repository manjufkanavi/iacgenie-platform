---
# Gitea role — Main entry point
# Manages: container health, Actions config, admin user, API tokens, runner status
# Hardened per Antares security audit (2026-08-17)

# ========================
# Secret Generation
# ========================

- name: "Gitea | Generate JWT secret"
  ansible.builtin.set_fact:
    gitea_jwt_secret: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}"
  no_log: true

- name: "Gitea | Generate internal token"
  ansible.builtin.set_fact:
    gitea_internal_token: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}"
  no_log: true

# ========================
# Data Directory Setup
# ========================

- name: "Gitea | Create data directory"
  ansible.builtin.file:
    path: "{{ gitea_data_dir | default('/home/mkanavi/docker/iacgenie/data/gitea') }}"
    owner: "1000"
    group: "1000"
    mode: "0755"
    state: directory

# ========================
# Configuration Deployment
# ========================

- name: "Gitea | Deploy app.ini configuration"
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ gitea_data_dir | default('/home/mkanavi/docker/iacgenie/data/gitea') }}/app.ini"
    owner: "1000"
    group: "1000"
    mode: "0640"
  notify: Reload docker compose

# ========================
# Backup Strategy
# ========================

- name: "Gitea | Create backup directory"
  ansible.builtin.file:
    path: "{{ gitea_backup_dir | default('/home/mkanavi/backups/gitea') }}"
    state: directory
    mode: "0700"

- name: "Gitea | Deploy backup script"
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Gitea backup script - managed by Ansible
      BACKUP_DIR="{{ gitea_backup_dir | default('/home/mkanavi/backups/gitea') }}"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      BACKUP_FILE="${BACKUP_DIR}/gitea_backup_${TIMESTAMP}.tar.gz"

      # Backup Gitea data directory
      tar -czf "${BACKUP_FILE}" -C /home/mkanavi/docker/iacgenie/data gitea/ 2>/dev/null

      # Remove backups older than {{ gitea_backup_retention_days | default(30) }} days
      find "${BACKUP_DIR}" -name "gitea_backup_*" -mtime +{{ gitea_backup_retention_days | default(30) }} -delete

      echo "Backup completed: ${BACKUP_FILE}"
    dest: /home/mkanavi/docker/iacgenie/scripts/gitea_backup.sh
    owner: mkanavi
    group: mkanavi
    mode: "0750"

- name: "Gitea | Deploy backup cron job"
  ansible.builtin.cron:
    name: "Gitea daily backup"
    minute: "0"
    hour: "4"
    job: "/home/mkanavi/docker/iacgenie/scripts/gitea_backup.sh >> /var/log/gitea_backup.log 2>&1"
    user: mkanavi

# ========================
# Container Health Check
# ========================

- name: "Gitea | Verify Gitea container is running"
  ansible.builtin.command: docker ps --filter "name=iacgenie-gitea" --format "{{ '{{.Names'}} }}"
  register: gitea_running
  changed_when: false
  failed_when: false

- name: "Gitea | Show Gitea status"
  ansible.builtin.debug:
    var: gitea_running.stdout_lines | default(['N/A - managed by docker-compose-generator'])

# ========================
# Admin User Provisioning
# ========================

- name: "Gitea | Check if admin user exists"
  ansible.builtin.command: docker exec iacgenie-gitea gitea admin user list
  register: gitea_admin_users
  changed_when: false
  failed_when: false

- name: "Gitea | Create admin user (if not exists)"
  ansible.builtin.command: >
    docker exec iacgenie-gitea gitea admin user create
    --username {{ gitea_admin_user }}
    --password {{ gitea_admin_password }}
    --email {{ gitea_admin_email }}
    --admin
  when:
    - gitea_admin_user not in (gitea_admin_users.stdout | default(''))
    - gitea_admin_password != 'CHANGE_ME_IN_VAULT'
  changed_when: true
  failed_when: false

- name: "Gitea | Create Gitea API token for CI"
  ansible.builtin.command: >
    docker exec iacgenie-gitea gitea admin user generate-access-token
    --username {{ gitea_admin_user }}
    --token-name hermes-ci-admin
    --scopes all
  register: gitea_api_token_result
  changed_when: true
  failed_when: false
  when: gitea_admin_password != 'CHANGE_ME_IN_VAULT'

# ========================
# Runner Status
# ========================

- name: "Gitea | Verify Gitea runner is running"
  ansible.builtin.command: systemctl is-active gitea-runner
  register: runner_status
  changed_when: false
  failed_when: false

- name: "Gitea | Show runner status"
  ansible.builtin.debug:
    msg: "Runner status: {{ runner_status.stdout | default('not found') }}"

# ========================
# Sync Script
# ========================

- name: "Gitea | Verify sync-gitea.py is deployed"
  ansible.builtin.stat:
    path: /home/mkanavi/bin/sync-gitea.py
  register: sync_script

- name: "Gitea | Show sync script status"
  ansible.builtin.debug:
    msg: "Sync script: {{ 'deployed' if sync_script.stat.exists else 'MISSING - run ansible-playbook' }}"