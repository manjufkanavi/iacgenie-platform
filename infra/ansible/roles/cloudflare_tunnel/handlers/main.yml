---
# Cloudflare Tunnel role - Handlers
- name: Restart cloudflared
  ansible.builtin.command: >
    docker compose -f /home/mkanavi/docker/iacgenie/docker-compose-unified.yml
    restart cloudflared
  ignore_errors: yes

- name: Verify cloudflared status
  ansible.builtin.command: docker ps --filter name=iacflared --format "{{ '{{.Status}}' }}"
  register: cf_status
  changed_when: false
  failed_when: false

- name: Show cloudflared status
  ansible.builtin.debug:
    var: cf_status.stdout
