- name: "OpenBao KV Bootstrap | Seed lightserp (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/lightserp"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        api_secret: "{{ openbao_ig_ls_api_secret }}"
        api_url: "http://lightserp-api:8000"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_lightserp
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed pagezen (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/pagezen"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        api_url: "http://lightserp-api:8000"
        api_secret: "{{ openbao_ig_ls_api_secret }}"
        port: "{{ openbao_ig_pagezen_port }}"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_pagezen
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed nsqd (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/nsqd"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        data_path: "{{ openbao_ig_nsqd_data_path }}"
        tcp_port: "{{ openbao_ig_nsqd_tcp_port }}"
        http_port: "{{ openbao_ig_nsqd_http_port }}"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_nsqd
  failed_when: false

# ── Step 3: Seed LightSerp Secrets ────────────────────────────────────────

- name: "OpenBao KV Bootstrap | Seed postgres (lightserp)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/lightserp/kv/data/postgres"
