    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        username: lightsrp
        host: postgres
        port: "5432"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ls_postgres
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed redis (lightserp)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/lightserp/kv/data/redis"
    method: POST
