# ── Summary ───────────────────────────────────────────────────────────────

- name: "OpenBao KV Bootstrap | Summary"
  ansible.builtin.debug:
    msg:
      - "KV v2 engines:"
      - "  iacgenie/kv     ({{ 'enabled' if openbao_ig_kv_mount.status in [200,201] else 'exists' }})"
      - "  lightserp/kv    ({{ 'enabled' if openbao_ls_kv_mount.status in [200,201] else 'exists' }})"
      - "  terraform/kv    ({{ 'enabled' if openbao_tf_kv_mount.status in [200,201] else 'exists' }}"
      - "Secrets written to iacgenie/kv: postgres, redis, minio, keycloak, gitea, openbao, searxng, lightserp, pagezen, nsqd, smtp, llm, jwt, cloudflare"
      - "Secrets written to lightserp/kv: postgres, redis, minio, searxng, api, keycloak, smtp, jwt"
      - "Secrets written to terraform/kv: postgres, openbao"
