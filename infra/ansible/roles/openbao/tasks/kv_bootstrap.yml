---
# OpenBao KV Bootstrap (P2.1)
# Enables KV v2 engines and seeds secrets from role defaults
# Uses: POST /v1/{path}/data/{key} for KV v2 writes

# ── Step 1: Enable KV v2 Engines ──────────────────────────────────────────

- name: "OpenBao KV Bootstrap | Enable iacgenie/kv engine"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/mounts/iacgenie/kv"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    validate_certs: false
    status_code: [200, 201, 409]
    timeout: 10
  register: openbao_ig_kv_mount
  failed_when: false
  changed_when: openbao_ig_kv_mount.status in [200, 201]

- name: "OpenBao KV Bootstrap | Enable lightserp/kv engine"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/mounts/lightserp/kv"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    validate_certs: false
    status_code: [200, 201, 409]
    timeout: 10
  register: openbao_ls_kv_mount
  failed_when: false
  changed_when: openbao_ls_kv_mount.status in [200, 201]

# ── Step 2: Seed IaCGenie Secrets ─────────────────────────────────────────

- name: "OpenBao KV Bootstrap | Seed postgres (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/postgres"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        username: postgres
        host: postgres
        port: "5432"
        password: "{{ openbao_ig_pg_password }}"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_postgres
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed redis (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/redis"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        host: redis
        port: "6379"
        password: "{{ openbao_ig_redis_password }}"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_redis
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed minio (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/minio"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        access_key: "{{ openbao_ig_minio_access_key }}"
        secret_key: "{{ openbao_ig_minio_secret_key }}"
        endpoint: "http://minio:9000"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_minio
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed keycloak (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/keycloak"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        admin_user: "{{ openbao_ig_kc_admin_user }}"
        admin_password: "{{ openbao_ig_kc_admin_password }}"
        db_password: "{{ openbao_ig_kc_db_password }}"
        db_host: "postgres"
        db_port: "5432"
        db_name: keycloak
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_keycloak
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed gitea (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/gitea"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        db_password: "{{ openbao_ig_gitea_db_password }}"
        smtp_addr: ""
        smtp_port: ""
        smtp_user: ""
        smtp_pass: ""
        smtp_from: ""
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_gitea
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed openbao (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/openbao"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        root_token: "{{ openbao_ig_openbao_root_token }}"
        addr: "https://127.0.0.1:8200"
        data_dir: /var/lib/openbao
        storage_type: file
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_openbao
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed searxng (iacgenie)"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/iacgenie/kv/data/searxng"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        secret: "{{ openbao_ig_searxng_secret }}"
        port: "8080"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_searxng
