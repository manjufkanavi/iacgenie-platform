---
# OpenBao KV Bootstrap (P2.1)
# Enables KV v2 engines and seeds secrets from role defaults
# Uses: POST /v1/{path}/data/{key} for KV v2 writes

# ── Step 1: Enable KV v2 Engines ──────────────────────────────────────────

- name: "OpenBao KV Bootstrap | Enable iacgenie/kv engine"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/sys/mounts/iacgenie/kv"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    validate_certs: false
    status_code: [200, 201, 409]
    timeout: 10
  register: openbao_ig_kv_mount
  failed_when: false
  changed_when: openbao_ig_kv_mount.status in [200, 201]

- name: "OpenBao KV Bootstrap | Enable lightserp/kv engine"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/sys/mounts/lightserp/kv"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    validate_certs: false
    status_code: [200, 201, 409]
    timeout: 10
  register: openbao_ls_kv_mount
  failed_when: false
  changed_when: openbao_ls_kv_mount.status in [200, 201]

# ── Step 1b: Enable Terraform KV Engine ───────────────────────────────────

- name: "OpenBao KV Bootstrap | Enable terraform/kv engine"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/sys/mounts/terraform/kv"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    validate_certs: false
    status_code: [200, 201, 409]
    timeout: 10
  register: openbao_tf_kv_mount
  failed_when: false
  changed_when: openbao_tf_kv_mount.status in [200, 201]

# ── Step 2: Seed IaCGenie Secrets ─────────────────────────────────────────

- name: "OpenBao KV Bootstrap | Seed postgres (iacgenie)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/iacgenie/kv/data/postgres"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      data:
        username: postgres
        host: postgres
        port: "5432"
        password: "{{ openbao_ig_pg_password }}"
    validate_certs: false
    status_code: [200, 201]
    timeout: 10
  register: openbao_ig_postgres
  failed_when: false

- name: "OpenBao KV Bootstrap | Seed redis (iacgenie)"
