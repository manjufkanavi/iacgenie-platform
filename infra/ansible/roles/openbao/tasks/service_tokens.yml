---
# OpenBao Service Token Generation (P1.2)
# Creates scoped tokens via the OpenBao API with read-only policies
# Uses root token to generate service tokens with project-scoped policies

- name: "OpenBao Bootstrap | Create service tokens directory"
  ansible.builtin.file:
    path: "{{ openbao_raft_data_dir }}/service_tokens"
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0750"

# ── IaCGenie Service Token ────────────────────────────────────────────────
- name: "OpenBao Bootstrap | Create IaCGenie service token"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/auth/token/create"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body:
      policies: ["iacgenie-service"]
      ttl: "{{ openbao_ig_token_ttl }}"
      token_type: "service"
      display_name: "iacgenie-service"
    validate_certs: false
    status_code: [200]
    timeout: 15
  register: openbao_ig_token_resp
  when: openbao_bootstrap_tokens | default(true) | bool
  failed_when: false

- name: "OpenBao Bootstrap | Save IaCGenie token"
  ansible.builtin.copy:
    content: "{{ openbao_ig_token_resp.auth.client_token }}\n"
    dest: "{{ openbao_raft_data_dir }}/service_tokens/iacgenie_token.txt"
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  when:
    - openbao_bootstrap_tokens | default(true) | bool
    - openbao_ig_token_resp is defined
    - openbao_ig_token_resp.auth is defined
    - openbao_ig_token_resp.auth.client_token is defined

