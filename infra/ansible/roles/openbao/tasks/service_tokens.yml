- name: "OpenBao Bootstrap | Summary service tokens"
  ansible.builtin.debug:
    msg:
      - "Service tokens created:"
      - "  iacgenie_token.txt    — read iacgenie/* (TTL: {{ openbao_ig_token_ttl }})"
      - "  lightserp_token.txt   — read lightserp/* (TTL: {{ openbao_ls_token_ttl }})"
      - "  terraform_token.txt   — read terraform/* (TTL: {{ openbao_tf_token_ttl }})"
      - "  backup_token.txt      — read iacgenie/* for backups (TTL: {{ openbao_backup_token_ttl }})"
