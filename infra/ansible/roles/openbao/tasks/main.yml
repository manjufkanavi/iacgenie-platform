---
# OpenBao role - Main entry point
# Manages: container env, KV engines, RBAC policies, service tokens

- name: "OpenBao | Create data directory"
  ansible.builtin.file:
    path: "{{ openbao_data_dir }}"
    owner: root
    group: root
    mode: "0700"
    state: directory

# ── Environment File ──────────────────────────────────────────────────────
- name: "OpenBao | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ openbao_compose_dir | default('/home/mkanavi/docker/iacgenie') }}/.env.openbao"
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Reload docker compose

# ── Policy Management ─────────────────────────────────────────────────────
- name: "OpenBao | Deploy policy files"
  ansible.builtin.template:
    src: "policies/{{ item.file }}"
    dest: "{{ openbao_raft_data_dir | default('/home/mkanavi/docker/iacgenie/openbao_raft') }}/policies/{{ item.file }}"
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  loop: "{{ openbao_policies | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: openbao_bootstrap_policies | default(true) | bool
  register: openbao_policy_deployed

- name: "OpenBao | Ensure policies directory exists"
  ansible.builtin.file:
    path: "{{ openbao_raft_data_dir | default('/home/mkanavi/docker/iacgenie/openbao_raft') }}/policies"
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0755"
  when: openbao_bootstrap_policies | default(true) | bool

# ── Policy Application (P1.1) ─────────────────────────────────────────────
- name: "OpenBao | Import policy management tasks"
  ansible.builtin.import_tasks: policies.yml
  when: openbao_bootstrap_policies | default(true) | bool

# ── KV Bootstrap (P2.1) ───────────────────────────────────────────────────
- name: "OpenBao | Import KV bootstrap tasks"
  ansible.builtin.import_tasks: kv_bootstrap.yml
  when: openbao_bootstrap_kv | default(true) | bool

# ── Service Token Generation (P1.2) ───────────────────────────────────────
- name: "OpenBao | Import service token generation tasks"
  ansible.builtin.import_tasks: service_tokens.yml
  when: openbao_bootstrap_tokens | default(true) | bool
# ── Permission Hardening (1.1.3) ─────────────────────────────────────────────

- name: "OpenBao | Fix raft data directory permissions"
  ansible.builtin.file:
    path: "{{ openbao_raft_data_dir | default('/home/mkanavi/docker/iacgenie/data/openbao_raft') }}"
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0750"
    recurse: true

# ── Init (if needed) ──────────────────────────────────────────────────────

- name: "OpenBao | Check if already initialized"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/sys/health"
    method: GET
    validate_certs: false
    status_code: [200]
    timeout: 10
  register: openbao_health
  when: openbao_bootstrap_policies | default(true) | bool
  failed_when: false
  changed_when: false

- name: "OpenBao | Show health status"
  ansible.builtin.debug:
    msg: "OpenBao initialized={{ openbao_health.json.initialized | default(false) }}, sealed={{ openbao_health.json.sealed | default(true) }}"
  when: openbao_health is succeeded

# ── Bootstrap ──────────────────────────────────────────────────────────────

# Bootstrap order: Unseal → Policies → KV → Tokens

# We need the token for bootstrap; read from init_keys.json if available
- name: "OpenBao | Read root token from init_keys.json (if available)"
  ansible.builtin.slurp:
    src: "{{ openbao_raft_data_dir | default('/home/mkanavi/docker/iacgenie/data/openbao_raft') }}/init_keys.json"
  register: openbao_init_keys_raw
  when: openbao_bootstrap_policies | default(true) | bool

- name: "OpenBao | Set root token from init_keys.json"
  ansible.builtin.set_fact:
    openbao_root_token: "{{ openbao_init_keys_raw.content | b64decode | from_json | json_query('root_token') }}"
  when:
    - openbao_init_keys_raw is succeeded
    - openbao_init_keys_raw.content | default('') | length > 0
    - openbao_bootstrap_policies | default(true) | bool

# ── Policy Application (P1.1) ─────────────────────────────────────────────
- name: "OpenBao | Import policy management tasks"
  ansible.builtin.import_tasks: policies.yml
  when: openbao_bootstrap_policies | default(true) | bool

# ── KV Bootstrap (P2.1) ───────────────────────────────────────────────────
- name: "OpenBao | Import KV bootstrap tasks"
  ansible.builtin.import_tasks: kv_bootstrap.yml
  when: openbao_bootstrap_kv | default(true) | bool

# ── Service Token Generation (P1.2) ───────────────────────────────────────
- name: "OpenBao | Import service token generation tasks"
  ansible.builtin.import_tasks: service_tokens.yml
  when: openbao_bootstrap_tokens | default(true) | bool

# ── Unseal ────────────────────────────────────────────────────────────────
- name: "OpenBao | Import unseal tasks"
  ansible.builtin.import_tasks: unseal.yml
  when: openbao_health.json.sealed | default(true) | bool