---
# OpenBao role - Main entry point
# Manages: container env, KV engines, RBAC policies, service tokens
#
# REQUIRED ENVIRONMENT VARIABLES (set before running Ansible):
#   OPENBAO_ROOT_TOKEN    — OpenBao root token
#   OPENBAO_UNSEAL_KEY_1  — Unseal key share 1/3
#   OPENBAO_UNSEAL_KEY_2  — Unseal key share 2/3
#   OPENBAO_UNSEAL_KEY_3  — Unseal key share 3/3

# ── Pre-flight checks ─────────────────────────────────────────────────────
- name: "OpenBao | Validate OPENBAO_ROOT_TOKEN is set"
  ansible.builtin.assert:
    that:
      - "openbao_root_token is defined"
      - "openbao_root_token | length > 0"
      - "openbao_root_token != 'CHANGE_ME'"
      - "openbao_root_token != 'CHANGE_ME_SEE_GITHUB_SECRETS'"
    fail_msg: "OPENBAO_ROOT_TOKEN must be set. Pass via --extra-vars openbao_root_token='...' or export env var OPENBAO_ROOT_TOKEN. Root token and unseal keys must be stored in GitHub Secrets."
    success_msg: "OPENBAO_ROOT_TOKEN is set."
  when:
    - openbao_bootstrap_policies | default(true) | bool

- name: "OpenBao | Validate unseal keys are set"
  ansible.builtin.assert:
    that:
      - "openbao_unseal_key_1 is defined and openbao_unseal_key_1 | length > 0"
      - "openbao_unseal_key_2 is defined and openbao_unseal_key_2 | length > 0"
      - "openbao_unseal_key_3 is defined and openbao_unseal_key_3 | length > 0"
    fail_msg: "OpenBao unseal keys must be set. Pass via --extra-vars: openbao_unseal_key_1='...', openbao_unseal_key_2='...', openbao_unseal_key_3='...'. Keys must be stored in GitHub Secrets."
    success_msg: "All unseal keys are set."

# ── Create data directory ──────────────────────────────────────────────────
- name: "OpenBao | Create data directory"
  ansible.builtin.file:
    path: "{{ openbao_data_dir }}"
    owner: root
    group: root
    mode: "0700"
    state: directory

# ── Environment File ──────────────────────────────────────────────────────
- name: "OpenBao | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ openbao_compose_dir | default('/home/mkanavi/docker/iacgenie') }}/.env.openbao"
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Reload docker compose

# ── Policy Management ─────────────────────────────────────────────────────
# Ensure directory exists FIRST, then deploy files
- name: "OpenBao | Ensure policies directory exists"
  ansible.builtin.file:
    path: "{{ openbao_raft_data_dir }}/policies"
    state: directory
    owner: mkanavi
    group: mkanavi
    mode: "0755"
  when: openbao_bootstrap_policies | default(true) | bool

- name: "OpenBao | Deploy policy files"
  ansible.builtin.template:
    src: "policies/{{ item.file }}"
    dest: "{{ openbao_raft_data_dir }}/policies/{{ item.file }}"
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  loop: "{{ openbao_policies | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: openbao_bootstrap_policies | default(true) | bool
  register: openbao_policy_deployed

# ── Raft Data Directory Permissions ───────────────────────────────────────
# Must be root:root 777 for Docker overlay FS compatibility (container runs as root)
- name: "OpenBao | Ensure raft data directory permissions"
  ansible.builtin.file:
    path: "{{ openbao_raft_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0777"
    recurse: true

# ── Init / Bootstrap ──────────────────────────────────────────────────────
- name: "OpenBao | Check if already initialized"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8200/v1/sys/health"
    method: GET
    validate_certs: false
    status_code: [200]
    timeout: 10
  register: openbao_health
  when: openbao_bootstrap_policies | default(true) | bool
  failed_when: false
  changed_when: false

- name: "OpenBao | Show health status"
  ansible.builtin.debug:
    msg: "OpenBao initialized={{ openbao_health.json.initialized | default(false) }}, sealed={{ openbao_health.json.sealed | default(true) }}"
  when: openbao_health is succeeded

# ── Bootstrap: Policies ───────────────────────────────────────────────────
- name: "OpenBao | Import policy management tasks"
  ansible.builtin.import_tasks: policies.yml
  when: openbao_bootstrap_policies | default(true) | bool

# ── Bootstrap: KV Engines ─────────────────────────────────────────────────
- name: "OpenBao | Import KV bootstrap tasks"
  ansible.builtin.import_tasks: kv_bootstrap.yml
  when: openbao_bootstrap_kv | default(true) | bool

# ── Bootstrap: Service Tokens ─────────────────────────────────────────────
- name: "OpenBao | Import service token generation tasks"
  ansible.builtin.import_tasks: service_tokens.yml
  when: openbao_bootstrap_tokens | default(true) | bool

# ── Bootstrap: Unseal ─────────────────────────────────────────────────────
- name: "OpenBao | Import unseal tasks"
  ansible.builtin.import_tasks: unseal.yml
  when: openbao_health.json.sealed | default(true) | bool
