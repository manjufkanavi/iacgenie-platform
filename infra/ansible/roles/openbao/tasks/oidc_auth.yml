# OpenBao OIDC Auth Backend Setup
# Phase 10.3: Integrates OpenBao with Keycloak for centralized authentication

- name: "10.3 | OpenBao | Enable OIDC auth method"
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/sys/auth/oidc"
    method: POST
    body_format: json
    body:
      type: oidc
      description: "OIDC auth via Keycloak"
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
    status_code: [200, 204]
  changed_when: true
  when: openbao_oidc_enabled | default(true) | bool

- name: "10.3 | OpenBao | Configure OIDC discovery URL"
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/oidc/config"
    method: POST
    body_format: json
    body:
      oidc_discovery_url: "{{ openbao_oidc_discovery_url }}"
      oidc_client_id: "{{ openbao_oidc_client_id }}"
      oidc_client_secret: "{{ openbao_oidc_client_secret }}"
      default_role: "user"
    headers:
      X-Vault-token: "{{ openbao_root_token }}"
    status_code: [200, 204]
  changed_when: true
  when: openbao_oidc_enabled | default(true) | bool

- name: "10.3 | OpenBao | Configure OIDC scopes and claims"
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/oidc/config/oidc_scopes"
    method: POST
    body_format: json
    body:
      oidc_scopes: "openid profile email roles"
    headers:
      X-Vault-token: "{{ openbao_root_token }}"
    status_code: [200, 204]
  changed_when: true
  when: openbao_oidc_enabled | default(true) | bool

# ── Create OIDC Roles ────────────────────────────────────────────────────

- name: "10.3 | OpenBao | Create platform-admin OIDC role"
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/oidc/roles/platform-admin"
    method: POST
    body_format: json
    body:
      user_claim: "email"
      allowed_redirect_uris: "{{ openbao_oidc_redirect_uris }}"
      bound_claims:
        roles: "platform-admin"
      policy: "admin"
      ttl: "{{ openbao_oidc_token_ttl }}"
      max_ttl: "{{ openbao_oidc_max_ttl }}"
      policies: "admin,platform-admin"
    headers:
      X-Vault-token: "{{ openbao_root_token }}"
    status_code: [200, 204, 409]
  changed_when: true
  when: openbao_oidc_enabled | default(true) | bool

- name: "10.3 | OpenBao | Create openbao-admin OIDC role"
