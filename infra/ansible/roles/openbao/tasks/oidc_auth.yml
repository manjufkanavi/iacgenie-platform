- name: "10.3 | OpenBao | Create user OIDC role (default)"
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/oidc/roles/user"
    method: POST
    body_format: json
    body:
      user_claim: "email"
      allowed_redirect_uris: "{{ openbao_oidc_redirect_uris }}"
      bound_claims: {}
      policy: "openbao-service-read"
      ttl: "{{ openbao_oidc_token_ttl }}"
      max_ttl: "{{ openbao_oidc_max_ttl }}"
      policies: "openbao-service-read"
    headers:
