# ── Display Summary ──────────────────────────────────────────────────────

- name: "10.3 | OpenBao | Display OIDC summary"
  ansible.builtin.debug:
    msg: >
      OpenBao OIDC integration complete.
      OIDC enabled: {{ openbao_oidc_enabled | default(true) }}
      Discovery URL: {{ openbao_oidc_discovery_url }}
      Auth URL: {{ openbao_api_url }}/v1/oidc/oidc/callback
      User role: default (openbao-service-read)
      Admin role: platform-admin / openbao-admin (full admin)
      Service roles: iacgenie-service, lightserp-service, openbao-service-read
  when: openbao_oidc_enabled | default(true) | bool
