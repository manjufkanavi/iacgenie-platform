---
# OpenBao Policy Management
# Applies RBAC policies via the OpenBao API

# ── Bootstrap Admin Policy ────────────────────────────────────────────────
- name: "OpenBao Bootstrap | Deploy admin policy"
  ansible.builtin.template:
    src: policies/admin.hcl.j2
    dest: "{{ openbao_raft_data_dir }}/policies/admin.hcl"
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  when: openbao_policies is defined and openbao_bootstrap_policies | default(true) | bool

- name: "OpenBao Bootstrap | Apply admin policy"
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/policies/acl/admin"
    method: PUT
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ lookup('template', 'policies/admin.hcl.j2') }}"
    validate_certs: false
    status_code: [200, 204, 409]
    timeout: 10
  register: openbao_admin_policy
  failed_when: false
  changed_when: openbao_admin_policy.status != 409

