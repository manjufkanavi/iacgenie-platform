- name: "OpenBao Bootstrap | Summary applied policies"
  ansible.builtin.debug:
    msg:
      - "OpenBao policies applied:"
      - "  admin                   — full read+write (platform admin)"
      - "  iacgenie-service        — read iacgenie/* (application services)"
      - "  lightserp-service       — read lightserp/* (application services)"
      - "  terraform-service       — read terraform/* (CI/CD)"
