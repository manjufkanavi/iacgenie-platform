---
# Cloudflare Tunnel role — Main entry point
# Manages: tunnel config, credentials, health monitoring
# Hardened per Antares security audit (2026-08-17)

# ========================
# Configuration Deployment
# ========================

- name: "Cloudflare | Create config directory"
  ansible.builtin.file:
    path: "{{ cloudflared_config_dir | default('/home/mkanavi/docker/iacgenie/docker/cloudflared') }}"
    state: directory
    mode: "0755"

- name: "Cloudflare | Deploy config.yml"
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ cloudflared_config_dir | default('/home/mkanavi/docker/iacgenie/docker/cloudflared') }}/config.yml"
    owner: mkanavi
    group: mkanavi
    mode: "0644"
  notify: Reload docker compose

- name: "Cloudflare | Ensure auth.json permissions are secure"
  ansible.builtin.file:
    path: "{{ cloudflared_credentials_file | default('/home/mkanavi/docker/iacgenie/docker/cloudflared/auth.json') }}"
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  ignore_errors: true

# ========================
# Cleanup
# ========================

- name: "Cloudflare | Remove legacy backup files"
  ansible.builtin.file:
    path: "{{ cloudflared_config_dir | default('/home/mkanavi/docker/iacgenie/docker/cloudflared') }}/{{ item }}"
    state: absent
  loop:
    - config.yml.bak
    - config.yml.old
    - "*.bak"
    - "*.old"
  ignore_errors: true

# ========================
# Backup Strategy
# ========================

- name: "Cloudflare | Create backup directory"
  ansible.builtin.file:
    path: "{{ cloudflared_backup_dir | default('/home/mkanavi/backups/cloudflared') }}"
    state: directory
    mode: "0700"

- name: "Cloudflare | Deploy backup script"
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Cloudflare Tunnel backup script - managed by Ansible
      BACKUP_DIR="{{ cloudflared_backup_dir | default('/home/mkanavi/backups/cloudflared') }}"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      BACKUP_FILE="${BACKUP_DIR}/cloudflared_backup_${TIMESTAMP}.tar.gz"

      # Backup Cloudflare config directory
      tar -czf "${BACKUP_FILE}" -C /home/mkanavi/docker/iacgenie/docker cloudflared/ 2>/dev/null

      # Remove backups older than {{ cloudflared_backup_retention_days | default(30) }} days
      find "${BACKUP_DIR}" -name "cloudflared_backup_*" -mtime +{{ cloudflared_backup_retention_days | default(30) }} -delete

      echo "Backup completed: ${BACKUP_FILE}"
    dest: /home/mkanavi/docker/iacgenie/scripts/cloudflared_backup.sh
    owner: mkanavi
    group: mkanavi
    mode: "0750"

- name: "Cloudflare | Deploy backup cron job"
  ansible.builtin.cron:
    name: "Cloudflare Tunnel daily backup"
    minute: "0"
    hour: "5"
    job: "/home/mkanavi/docker/iacgenie/scripts/cloudflared_backup.sh >> /var/log/cloudflared_backup.log 2>&1"
    user: mkanavi

# ========================
# Health Check
# ========================

- name: "Cloudflare | Verify Cloudflare Tunnel is running"
  ansible.builtin.command: docker ps --filter "name=iacgenie-cloudflared" --format "{{ '{{.Names'}} }}"
  register: cloudflared_running
  changed_when: false
  failed_when: false

- name: "Cloudflare | Show Cloudflare Tunnel status"
  ansible.builtin.debug:
    var: cloudflared_running.stdout_lines | default(['N/A - managed by docker-compose-generator'])