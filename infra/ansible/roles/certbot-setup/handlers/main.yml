---
# =============================================================================
# certbot-setup role — handlers
# =============================================================================

- name: test certbot renewal
  ansible.builtin.command:
    cmd: certbot renew --dry-run
  register: certbot_dry_run
  changed_when: false
  check_mode: false
  failed_when: false

- name: force certbot renewal
  ansible.builtin.command:
    cmd: certbot renew --force-renewal
  register: certbot_force_renew
  changed_when: false
  check_mode: false
