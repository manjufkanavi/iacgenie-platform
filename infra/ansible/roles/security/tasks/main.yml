---
# Install and configure security services (ClamAV + CrowdSec)
# Docker services managed by unified docker-compose.yml
# This role handles host-level CrowdSec bouncer only
#
# IMPORTANT: Security compose (docker-compose.security.yml) is deprecated.
# Services clamav-engine, crowdsec-engine, crowdsec-web are in unified compose.

- name: "Security | Create security service directory"
  ansible.builtin.file:
    path: "/home/mkanavi/docker/iacgenie/security"
    state: directory
    mode: "0755"

- name: "Security | Create nginx-logs symlink directory"
  ansible.builtin.file:
    path: "/home/mkanavi/docker/iacgenie/nginx-logs"
    state: directory
    mode: "0755"

- name: "Security | Create symlink for nginx access.log"
  ansible.builtin.file:
    src: "/var/log/nginx/access.log"
    dest: "/home/mkanavi/docker/iacgenie/nginx-logs/access.log"
    state: link
    force: true
    mode: "0644"

- name: "Security | Create symlink for nginx error.log"
  ansible.builtin.file:
    src: "/var/log/nginx/error.log"
    dest: "/home/mkanavi/docker/iacgenie/nginx-logs/error.log"
    state: link
    force: true
    mode: "0644"

- name: "Security | Remove deprecated docker-compose.security.yml"
  ansible.builtin.file:
    path: "/home/mkanavi/docker/iacgenie/docker-compose.security.yml"
    state: absent

- name: "Security | CrowdSec bouncer (host-based) — SKIPPED (managed via docker compose)"
  ansible.builtin.debug:
    msg: "CrowdSec is managed via docker compose (crowdsec-engine/crowdsec-backend). Host-based bouncer installation is skipped."
  changed_when: false
