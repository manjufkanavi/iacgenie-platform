---
# Services playbook: deploy all Docker services
# Updated flow: OpenBao first → fetch secrets → deploy services
#
# SEQUENCE:
# 1. common/docker/user_management/ntp_config — Foundation
# 2. postgresql/redis/minio — Core services (no secrets needed)
# 3. openbao — Start OpenBao container
# 4. openbao-secrets — Unseal + seed KV data
# 5. deploy-env — Fetch all KV secrets → write unified .env
# 6. docker-compose-generator — Generate docker-compose.yml + deploy
# 7. remaining services — keycloak, gitea, lightserp, etc.
# 8. nginx/cloudflare_tunnel — Edge layer

- hosts: all
  become: true
  become_method: sudo

  roles:
    # Phase 1: Foundation & System Hardening
    - role: common
    - role: docker
    - role: user_management
    - role: ntp_config

    # Phase 2: Core Infrastructure Services (no external secrets)
    - role: postgresql
    - role: redis
    - role: minio

    # Phase 3: OpenBao — MUST come before other services
    - role: openbao

    # Phase 4: Unseal OpenBao and seed KV
    - role: openbao-secrets

    # Phase 5: Fetch all secrets from OpenBao → write unified .env
    - role: deploy-env

    # Phase 6: Generate and deploy docker-compose.yml
    - role: docker-compose-generator

    # Phase 7: Remaining application services
    - role: keycloak
    - role: gitea
    - role: lightserp
    - role: searxng
    - role: nsqd
    - role: pagezen

    # Phase 8: Edge & Access Layer
    - role: nginx
    - role: cloudflare_tunnel

    # Phase 9: Secrets & Security
    - role: backup

    # Phase 10: Resilience & Operations
    - role: monitoring
    - role: logging_stack

    # Phase 11: Multi-Tenant & RBAC
    - role: keycloak_realm
    - role: gitea_orgs

  # Post-deploy tasks
  tasks:
    - name: "Import OpenBao unseal tasks"
      ansible.builtin.import_tasks:
        file: ../roles/openbao/tasks/unseal.yml
      when:
        - not openbao_skip_unseal | default(false) | bool

    - name: "Import Keycloak realm provisioning"
      ansible.builtin.import_tasks:
        file: ../roles/keycloak_realm/tasks/main.yml
      when:
        - keycloak_provision_realm | default(true) | bool

    - name: "Import Gitea org provisioning"
      ansible.builtin.import_tasks:
        file: ../roles/gitea_orgs/tasks/main.yml
      when:
        - gitea_provision_orgs | default(false) | bool
