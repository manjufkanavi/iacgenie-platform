---
# Services playbook: deploy all IacGenie infrastructure
#
# DEPLOYMENT SEQUENCE:
#   1. Foundation (common, docker, user, ntp)
#   2. Core infra services via compose (postgres, redis, minio)
#   3. OpenBao bootstrap (unseal + seed KV)
#   4. Runtime env generation (fetch-openbao-env.py → .env)
#   5. Docker compose deployment (all containers)
#   6. Application services (keycloak, gitea, lightserp, searxng, nsqd, pagezen)
#   7. Nginx config (reverse proxy)
#   8. Edge layer (cloudflared tunnel)
#   9. Security (backup, monitoring, logging)
#  10. Multi-tenant (keycloak realm, gitea orgs)
#  11. GitHub secrets sync (backup OpenBao KV to GH)
#
# IMPORTANT: OpenBao MUST be running and unsealed before secrets generation.
# The .env file is the SINGLE SOURCE OF TRUTH for all container secrets.

- hosts: all
  become: true
  become_method: sudo
  serial: 1

  pre_tasks:
    - name: "Services | Verify Docker is accessible"
      ansible.builtin.command: docker info
      changed_when: false
      failed_when: false
      register: docker_info

    - name: "Services | Report Docker status"
      ansible.builtin.debug:
        msg: "{{ 'Docker OK' if docker_info.rc == 0 else 'Docker NOT available' }}"

  roles:
    # Phase 1: Foundation
    - role: common
    - role: docker
    - role: user_management
    - role: ntp_config

    # Phase 2: Core infrastructure (docker containers via compose)
    - role: postgresql
    - role: redis
    - role: minio

    # Phase 3: OpenBao
    - role: openbao

    # Phase 4: OpenBao secrets generation
    # - role: openbao-secrets

    # Phase 5: Runtime environment generation
    - role: deploy-env
    - role: auth-wrapper

    # Phase 6: Docker compose deployment
    - role: docker-compose-generator

    # Phase 7: Application services
    - role: keycloak
    - role: gitea
    - role: lightserp
    - role: searxng
    - role: nsqd
    - role: pagezen

    # Phase 8: Edge & security
    - role: nginx-config
    - role: cloudflare_tunnel
    - role: backup
    - role: monitoring
    - role: logging_stack

    # Phase 9: Multi-tenant
    - role: keycloak_realm
    - role: gitea_orgs

    # Phase 10: GitHub backup
    - role: github-secrets-sync

  post_tasks:
    - name: "Services | Verify docker compose is running"
      ansible.builtin.command: "docker compose -f /home/mkanavi/docker/iacgenie/docker-compose.yml ps"
      register: compose_status
      changed_when: false
      failed_when: false

    - name: "Services | Show compose status"
      ansible.builtin.debug:
        var: compose_status.stdout

    - name: "Services | Verify nginx is serving"
      ansible.builtin.command: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: "Services | Show nginx status"
      ansible.builtin.debug:
        var: nginx_status.stdout

    - name: "Services | Verify cloudflared container is running"
      ansible.builtin.command: docker inspect iacgenie_cloudflared --format '{{.State.Running}}'
      register: cf_status

    - name: "Services | Disable systemd cloudflared service"
      ansible.builtin.systemd:
        name: cloudflared.service
        enabled: false
        state: stopped
      ignore_errors: true

    - name: "Services | Show cloudflared status"
      ansible.builtin.debug:
        var: cf_status.stdout
