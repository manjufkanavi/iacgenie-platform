---
# Initialize and configure OpenBao after first deploy
# Run once to bootstrap: init, unseal, enable engines, create policies
#
# Usage:
#   ansible-playbook -i hosts infra/ansible/playbooks/openbao-init.yml
#   ansible-playbook -i hosts infra/ansible/playbooks/openbao-init.yml --skip-tasks=init
#
- hosts: iacgenie-server
  become: true
  vars:
    openbao_addr: "http://127.0.0.1:8200"
    openbao_raft_dir: /home/mkanavi/docker/iacgenie/openbao_raft
    openbao_docker_compose: /home/mkanavi/docker/iacgenie
    openbao_hcl_dest: /home/mkanavi/docker/iacgenie/data/openbao/openbao-prod.hcl
    openbao_hcl_dest_alt: /home/mkanavi/docker/iacgenie/openbao_raft/openbao-prod.hcl
    openbao_tls_cert: /etc/letsencrypt/live/vault.iacgenie.com/fullchain.pem
    openbao_tls_key: /etc/letsencrypt/live/vault.iacgenie.com/privkey.pem

  tasks:
    # ── Phase 1: Config deployment ───────────────────────────────────────
    - name: "Phase 1 | Deploy OpenBao HCL config"
      ansible.builtin.copy:
        src: roles/openbao/files/prod.hcl
        dest: "{{ openbao_hcl_dest }}"
        owner: mkanavi
        group: mkanavi
        mode: "0644"

    - name: "Phase 1 | Deploy OpenBao HCL config (alt path for compose)"
      ansible.builtin.copy:
        src: roles/openbao/files/prod.hcl
        dest: "{{ openbao_hcl_dest_alt }}"
        owner: mkanavi
        group: mkanavi
        mode: "0644"

    - name: "Phase 1 | Restart OpenBao container"
      ansible.builtin.command:
        cmd: docker compose up -d openbao
      args:
        chdir: "{{ openbao_docker_compose }}"

    # ── Phase 2: Wait for OpenBao to be ready ────────────────────────────
    - name: "Phase 2 | Wait for OpenBao container to be running"
      ansible.builtin.command: >
        docker inspect --format='{{ '{{' }}.State.Status{{ '}}' }}'
        iacgenie_openbao
      register: bao_container_status
      retries: 12
      delay: 5
      until: bao_container_status.stdout == 'running'

    - name: "Phase 2 | Wait for OpenBao API to respond"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao status
        --address={{ openbao_addr }}
      register: bao_health
      retries: 20
      delay: 5
      until: bao_health.rc == 0
      changed_when: false

    # ── Phase 3: Initialize (only if not already) ─────────────────────────
    - name: "Phase 3 | Check if OpenBao is already initialized"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao status
        --address={{ openbao_addr }}
      register: bao_init_check
      changed_when: false
      ignore_errors: true

    - name: "Phase 3 | Initialize OpenBao (3 shares, threshold 2)"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao operator init
        --address={{ openbao_addr }}
        -key-shares=3
        -key-threshold=2
        -format=json
      register: init_result
      when:
        - init_result is not defined
        - '"sealed" not in (bao_init_check.stdout | default(""))'
      changed_when: init_result is succeeded and not ("Already Initialized" in init_result.stdout)

    - name: "Phase 3 | Save unseal keys and root token"
      ansible.builtin.copy:
        content: "{{ init_result.stdout }}"
        dest: "{{ item }}"
        owner: mkanavi
        group: mkanavi
        mode: "0600"
      loop:
        - "{{ openbao_raft_dir }}/init_keys.json"
        - /home/mkanavi/docker/iacgenie/data/openbao_raft/init_keys.json
      when:
        - init_result is succeeded
        - not ("Already Initialized" in init_result.stdout)

    - name: "Phase 3 | Extract unseal keys"
      ansible.builtin.set_fact:
        openbao_unseal_keys: "{{ init_result.stdout | from_json | json_query('unseal_keys_b64') }}"
      when:
        - init_result is succeeded
        - not ("Already Initialized" in init_result.stdout)

    - name: "Phase 3 | Unseal key 1/3"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao operator unseal
        --address={{ openbao_addr }}
        {{ openbao_unseal_keys[0] }}
      when:
        - openbao_unseal_keys is defined
        - init_result is succeeded

    - name: "Phase 3 | Unseal key 2/3"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao operator unseal
        --address={{ openbao_addr }}
        {{ openbao_unseal_keys[1] }}
      when:
        - openbao_unseal_keys is defined
        - init_result is succeeded

    # ── Phase 4: Enable secret engines ───────────────────────────────────
    - name: "Phase 4 | Enable KV v2 secret engine (iacgenie)"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao secrets enable
        --address={{ openbao_addr }}
        -path=iacgenie kv-v2
      changed_when: true

    - name: "Phase 4 | Enable KV v2 secret engine (lightserp)"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao secrets enable
        --address={{ openbao_addr }}
        -path=lightserp kv-v2
      changed_when: true

    - name: "Phase 4 | Enable KV v2 secret engine (terraform)"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao secrets enable
        --address={{ openbao_addr }}
        -path=terraform kv-v2
      changed_when: true

    - name: "Phase 4 | Enable Transit secret engine"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao secrets enable
        --address={{ openbao_addr }}
        transit
      changed_when: true

    - name: "Phase 4 | Enable Database secret engine"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao secrets enable
        --address={{ openbao_addr }}
        database
      changed_when: true

    - name: "Phase 4 | Enable SSH secret engine"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao secrets enable
        --address={{ openbao_addr }}
        ssh
      changed_when: true

    # ── Phase 5: Enable AppRole auth ─────────────────────────────────────
    - name: "Phase 5 | Enable AppRole auth method"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao auth enable
        --address={{ openbao_addr }}
        approle
      changed_when: true

    # ── Phase 6: Deploy policies ─────────────────────────────────────────
    - name: "Phase 6 | Deploy iacgenie-backend policy"
      ansible.builtin.copy:
        content: "{{ lookup('file', 'roles/openbao/files/policies/iacgenie-backend.hcl') }}"
        dest: /tmp/iacgenie-backend-policy.hcl

    - name: "Phase 6 | Apply iacgenie-backend policy"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao policy write
        --address={{ openbao_addr }}
        iacgenie-backend-svc /tmp/iacgenie-backend-policy.hcl
      changed_when: true

    - name: "Phase 6 | Deploy lightserp policy"
      ansible.builtin.copy:
        content: "{{ lookup('file', 'roles/openbao/files/policies/lightserp.hcl') }}"
        dest: /tmp/lightserp-policy.hcl

    - name: "Phase 6 | Apply lightserp policy"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao policy write
        --address={{ openbao_addr }}
        lightserp-api-svc /tmp/lightserp-policy.hcl
      changed_when: true

    - name: "Phase 6 | Deploy openbao-backup policy"
      ansible.builtin.copy:
        content: "{{ lookup('file', 'roles/openbao/files/policies/openbao-backup.hcl') }}"
        dest: /tmp/openbao-backup-policy.hcl

    - name: "Phase 6 | Apply openbao-backup policy"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao policy write
        --address={{ openbao_addr }}
        openbao-backup /tmp/openbao-backup-policy.hcl
      changed_when: true

    - name: "Phase 6 | Deploy root-admin policy"
      ansible.builtin.copy:
        content: "{{ lookup('file', 'roles/openbao/files/policies/root-admin.hcl') }}"
        dest: /tmp/root-admin-policy.hcl

    - name: "Phase 6 | Apply root-admin policy"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao policy write
        --address={{ openbao_addr }}
        root-admin /tmp/root-admin-policy.hcl
      changed_when: true

    # ── Phase 7: Create AppRole roles ────────────────────────────────────
    - name: "Phase 7 | Create AppRole for iacgenie-backend-svc"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao write
        --address={{ openbao_addr }}
        auth/approle/role/iacgenie-backend-svc
        secret_id_ttl=24h
        token_num_uses=0
        token_ttl=2h
        token_max_ttl=4h
        token_bound_cidrs={{ vm_subnet | default('192.168.0.0/24') }}
        policies=iacgenie-backend-svc
      changed_when: true

    - name: "Phase 7 | Create AppRole for lightserp-api-svc"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao write
        --address={{ openbao_addr }}
        auth/approle/role/lightserp-api-svc
        secret_id_ttl=24h
        token_num_uses=0
        token_ttl=2h
        token_max_ttl=4h
        token_bound_cidrs={{ vm_subnet | default('192.168.0.0/24') }}
        policies=lightserp-api-svc
      changed_when: true

    - name: "Phase 7 | Create AppRole for openbao-backup"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao write
        --address={{ openbao_addr }}
        auth/approle/role/openbao-backup
        secret_id_ttl=24h
        token_num_uses=0
        token_ttl=1h
        token_max_ttl=2h
        token_bound_cidrs={{ vm_subnet | default('192.168.0.0/24') }}
        policies=openbao-backup
      changed_when: true

    - name: "Phase 7 | Create AppRole credential dir on host"
      ansible.builtin.file:
        path: "{{ openbao_docker_compose }}/openbao-approle"
        state: directory
        owner: mkanavi
        group: mkanavi
        mode: "0750"

    - name: "Phase 7 | Get iacgenie-backend AppRole role_id"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao read
        --address={{ openbao_addr }}
        -format=json
        auth/approle/role/iacgenie-backend-svc/role-id
      register: svc_backend_role_id
      changed_when: false

    - name: "Phase 7 | Get lightserp-api AppRole role_id"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao read
        --address={{ openbao_addr }}
        -format=json
        auth/approle/role/lightserp-api-svc/role-id
      register: svc_lightserp_role_id
      changed_when: false

    - name: "Phase 7 | Get iacgenie-backend AppRole secret_id"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao write
        --address={{ openbao_addr }}
        -format=json
        auth/approle/role/iacgenie-backend-svc/secret-id
      register: svc_backend_secret_id
      changed_when: true

    - name: "Phase 7 | Get lightserp-api AppRole secret_id"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao write
        --address={{ openbao_addr }}
        -format=json
        auth/approle/role/lightserp-api-svc/secret-id
      register: svc_lightserp_secret_id
      changed_when: true

    - name: "Phase 7 | Write iacgenie-backend AppRole credentials"
      ansible.builtin.copy:
        content: "{{ svc_backend_role_id.stdout | from_json | json_query('data.role_id') }}\n{{ svc_backend_secret_id.stdout | from_json | json_query('data.secret_id') }}\n"
        dest: "{{ openbao_docker_compose }}/openbao-approle/iacgenie-backend-creds.txt"
        owner: mkanavi
        group: mkanavi
        mode: "0600"

    - name: "Phase 7 | Write lightserp-api AppRole credentials"
      ansible.builtin.copy:
        content: "{{ svc_lightserp_role_id.stdout | from_json | json_query('data.role_id') }}\n{{ svc_lightserp_secret_id.stdout | from_json | json_query('data.secret_id') }}\n"
        dest: "{{ openbao_docker_compose }}/openbao-approle/lightserp-api-creds.txt"
        owner: mkanavi
        group: mkanavi
        mode: "0600"

    - name: "Phase 7 | Set credential file permissions"
      ansible.builtin.file:
        path: "{{ openbao_docker_compose }}/openbao-approle"
        owner: mkanavi
        group: mkanavi
        mode: "0750"

    # ── Phase 7.5: Store all service secrets in OpenBao ─────────────────
    # Deploy scripts
    - name: "Phase 7.5 | Deploy env parser script"
      ansible.builtin.copy:
        src: roles/openbao/files/parse_env.py
        dest: /tmp/parse_env.py
        mode: "0755"

    - name: "Phase 7.5 | Deploy seed script"
      ansible.builtin.copy:
        src: roles/openbao/files/seed_openbao_kv.py
        dest: /tmp/seed_openbao_kv.py
        mode: "0755"

    # Parse .env file
    - name: "Phase 7.5 | Parse .env file into dict"
      ansible.builtin.command: >
        python3 /tmp/parse_env.py {{ openbao_docker_compose }}/.env
      register: _parsed_env
      changed_when: false

    - name: "Phase 7.5 | Set parsed env fact"
      ansible.builtin.set_fact:
        env: "{{ _parsed_env.stdout | from_json }}"
      changed_when: false

    # Seed all secrets using Python script (handles special chars safely)
    - name: "Phase 7.5 | Deploy seed script to VM"
      ansible.builtin.copy:
        src: roles/openbao/files/seed_openbao_kv.py
        dest: /tmp/seed_openbao_kv.py
        mode: "0755"

    - name: "Phase 7.5 | Seed all secrets into OpenBao KV v2"
      ansible.builtin.command: python3 /tmp/seed_openbao_kv.py
      environment:
        OPENBAO_ADDR: "{{ openbao_addr }}"
      changed_when: true

    # ── Phase 8: Deploy scripts & configs ────────────────────────────────
    - name: "Phase 8 | Deploy backup script"
      ansible.builtin.copy:
        src: roles/openbao/files/backup_openbao.py
        dest: /home/mkanavi/docker/iacgenie/scripts/backup_openbao.py
        owner: mkanavi
        group: mkanavi
        mode: "0755"

    - name: "Phase 8 | Deploy OpenBao injector script"
      ansible.builtin.copy:
        src: roles/openbao/files/openbao_injector.py
        dest: /home/mkanavi/docker/iacgenie/scripts/openbao_injector.py
        owner: mkanavi
        group: mkanavi
        mode: "0755"

    - name: "Phase 8 | Deploy injector entrypoint wrapper"
      ansible.builtin.copy:
        src: roles/openbao/files/inject-secrets.sh
        dest: /home/mkanavi/docker/iacgenie/scripts/inject-secrets.sh
        owner: mkanavi
        group: mkanavi
        mode: "0755"

    - name: "Phase 8 | Deploy service config files"
      ansible.builtin.copy:
        src: "roles/openbao/files/configs/{{ item }}"
        dest: "/home/mkanavi/docker/iacgenie/openbao-configs/{{ item }}"
        owner: mkanavi
        group: mkanavi
        mode: "0644"
      loop:
        - iacgenie-backend.json
        - lightserp-api.json

    - name: "Phase 8 | Create config symlink dir"
      ansible.builtin.file:
        path: /home/mkanavi/docker/iacgenie/openbao-configs
        state: directory
        owner: mkanavi
        group: mkanavi
        mode: "0755"

    - name: "Phase 8 | Configure backup cron (every 6 hours)"
      ansible.builtin.cron:
        name: "OpenBao Raft snapshot backup"
        minute: "0"
        hour: "0,6,12,18"
        job: "python3 /home/mkanavi/docker/iacgenie/scripts/backup_openbao.py >> /var/log/openbao-backup.log 2>&1"

    # ── Phase 9: Verify ──────────────────────────────────────────────────
    - name: "Phase 9 | Final OpenBao status"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao status
        --address={{ openbao_addr }}
      register: bao_final
      changed_when: false

    - name: "Phase 9 | Show final status"
      ansible.builtin.debug:
        var: bao_final.stdout_lines
