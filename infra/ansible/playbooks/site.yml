---
# =============================================================================
# Ansible Site Playbook — IacGenie Platform Infrastructure
# Installs & configures ALL services: Docker, nginx, cloudflared,
# OpenBao, Gitea, Keycloak, Postgres, Redis, MinIO, NSQD, SearXNG,
# LightSerp, Monitoring stack (Prometheus, Loki, Grafana), Security
# =============================================================================

- name: Configure system hardening and users
  hosts: iacgenie-server
  become: true
  roles:
    - common

- name: Install base infrastructure services
  hosts: iacgenie-server
  become: true
  roles:
    - nginx-config
    - cloudflare_tunnel

- name: Generate .env from OpenBao secrets
  hosts: iacgenie-server
  become: true
  roles:
    - deploy-env

- name: Deploy unified infrastructure services
  hosts: iacgenie-server
  become: true
  roles:
    - openbao
    - docker-compose-generator
    - security

- name: Deploy logging stack (Loki + Promtail)
  hosts: iacgenie-server
  become: true
  roles:
    - logging_stack

- name: Deploy monitoring stack
  hosts: iacgenie-server
  become: true
  roles:
    - monitoring

- name: Configure user management
  hosts: iacgenie-server
  become: true
  roles:
    - user_management

- name: Configure backup & restore
  hosts: iacgenie-server
  become: true
  roles:
    - backup
