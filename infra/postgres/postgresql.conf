# PostgreSQL 15 — Audit Logging Configuration
# =============================================================================
# Loaded via -c config_file= option in docker-compose
# Provides supplementary audit logging on top of PostgreSQL defaults
# =============================================================================

# ---------------------------------------------------------------------------
# Connection Auditing
# ---------------------------------------------------------------------------
log_connections = on
log_disconnections = on

# ---------------------------------------------------------------------------
# Statement Auditing
# ---------------------------------------------------------------------------
log_statement = 'all'
log_duration = on
log_lock_waits = on
log_min_duration_statement = 1000

# ---------------------------------------------------------------------------
# Replication Auditing
# ---------------------------------------------------------------------------
log_replication_commands = on

# ---------------------------------------------------------------------------
# Log Prefix (overridden via docker-compose command line)
# ---------------------------------------------------------------------------
log_line_prefix = '%t [%p] %u@%d %m '

# Network Configuration
listen_addresses = '*'
