# PostgreSQL Audit Logging Configuration
# Place at: postgres/audit-logging.conf
# Load via postgresql.extraConfig in docker-compose

# Log all connections and disconnections
log_connections = on
log_disconnections = on

# Log all statements (including DDL and DCL)
log_statement = 'all'

# Log duration of each statement (helps detect slow queries)
log_duration = on

# Log failed login attempts
log_line_prefix = '%m [%p] %u@%d %r '

# Log role creation, alteration, and dropping
# (covered by log_statement = 'all')

# Log lock waits (helps detect deadlock scenarios)
log_lock_waits = on

# Minimum duration to log (0 = log all)
log_min_duration_statement = 1000

# Log configuration changes
# (covered by log_statement = 'ddl')

# Log replication-related events
log_replication_commands = on

# Truncate long lines (for readability)
log_rotation_age = 1
log_rotation_size = 10
