# Loki Configuration — Centralized Logging Backend
# Phase 10.17: Centralized Logging (Loki + Promtail)

server:
  http_listen_port: 3100
  grpc_listen_port: 0

common:
  path_prefix: /opt/infrastructure/loki
  storage:
    filesystem:
      chunks_directory: /opt/infrastructure/loki/chunks
      rules_directory: /opt/infrastructure/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /opt/infrastructure/loki/chunks
  tsdb_shipper:
    active_index_directory: /opt/infrastructure/loki/index
    cache_location: /opt/infrastructure/loki/tsdb-cache

compactor:
  working_directory: /opt/infrastructure/loki/compactor
  retention_enabled: true
  retention_deletion_mode: deleted
  retention_document_types: ["index", "chunks"]

limits_config:
  retain_period: 720h  # 30 days retention
  max_query_length: 720h
  max_query_parallelism: 16
  max_entries_per_query: 50000
  max_query_lookup_samples: 500000
  ingestion_rate_mb: 64
  ingestion_rate_strategy: local
  max_global_streams_per_org: 0
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_label_values_count: 0

ingester:
  lifecycle_stopped: true
  wal:
    enabled: true
    dir: /opt/infrastructure/loki/wal
  chunk_idle_period: 30m
  chunk_block_size: 262144
  chunk_retain_period: 5m
  max_transfer_retries: 0

ruler:
  storage:
    type: local
    local:
      directory: /opt/infrastructure/loki/rules
  ring:
    kvstore:
      store: inmemory
  rule_path: /opt/infrastructure/loki/rules

analytics:
  reporting_enabled: false
