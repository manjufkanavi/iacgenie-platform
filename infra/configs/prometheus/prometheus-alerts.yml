# Prometheus Alert Rules — Monitoring Stack
# Phase 10.18 & 10.22: OOM kill monitoring

groups:
  - name: service_alerts
    rules:
      # Service Down Alerts
      - alert: service_down
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 2 minutes."

      # High CPU Usage (>85%)
      - alert: high_cpu_usage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 85% on {{ $labels.instance }} for more than 5 minutes (current value: {{ $value }}%)."

      # High Memory Usage (>90%)
      - alert: high_memory_usage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% on {{ $labels.instance }} for more than 5 minutes (current value: {{ $value }}%)."

      # Disk Full (>85%)
      - alert: disk_full
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage high on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.instance }} at {{ $value }}% (mountpoint: {{ $labels.mountpoint }})."

      # Certificate Expiry (<30 days)
      - alert: cert_expiry
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon for {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanize_duration }}."

      # Backup Failed (check for recent backup timestamps)
      - alert: backup_failed
        expr: time() - backup_last_success_timestamp > 86400
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Backup failed for {{ $labels.instance }}"
          description: "Last backup for {{ $labels.instance }} was more than 24 hours ago (last success: {{ $value }}s ago)."

      # OOM Kill Detection
      - alert: oom_killed
        expr: increase(container_oom_events_total{container!="",pod!=""}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "OOM kill detected on {{ $labels.container }}"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} was OOM killed."

      # Docker container OOM kill (alternative metric)
      - alert: docker_oom_killed
        expr: increase(docker_container_oom_kills_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Docker container OOM killed"
          description: "Docker container {{ $labels.name }} was OOM killed."

  - name: infrastructure_alerts
    rules:
      # Host not reachable
      - alert: host_unreachable
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is unreachable"
          description: "The host {{ $labels.instance }} has been unreachable for more than 1 minute."

      # High network latency
      - alert: high_latency
        expr: probe_duration_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency to {{ $labels.instance }}"
          description: "Probe latency to {{ $labels.instance }} is {{ $value }}s (threshold: 2s)."
