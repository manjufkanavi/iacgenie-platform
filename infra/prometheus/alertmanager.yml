# Alertmanager Configuration — IacGenie Platform
# Routes: critical → webhook/Telegram, warning → batched, security (Falco) → immediate
# Receivers: default webhook, critical webhook, warning webhook, security webhook
# NOTE: Environment variables must be set on the host or replaced with actual values

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity", "category"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "default"

  routes:
    # Security alerts (Falco/Falcosidekick) → immediate + all receivers
    - match:
        category: security
      receiver: "security-alerts"
      repeat_interval: 5m
      continue: true

    # Critical alerts → immediate notification
    - match:
        severity: critical
      receiver: "critical-alerts"
      repeat_interval: 15m
      continue: true

    # Warning alerts → batched
    - match:
        severity: warning
      receiver: "warning-alerts"
      repeat_interval: 1h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://localhost:2800/alerts"
        send_resolved: true

  - name: "critical-alerts"
    webhook_configs:
      - url: "http://localhost:2800/alerts"
        send_resolved: true

  - name: "warning-alerts"
    webhook_configs:
      - url: "http://localhost:2800/alerts"
        send_resolved: true

  - name: "security-alerts"
    webhook_configs:
      - url: "http://localhost:2800/falco-events"
        send_resolved: true

# Inhibit rules — suppress warnings when critical exists
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "category"]
