# Nginx reverse proxy for IacGenie services
# Managed by Ansible — production hardened with security headers
# Version: 4.0 — 2026-08-08
# Changes: Removed api/app/lightserp vHosts, added base domain landing, HTTPS Grafana

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# CORS headers
map $request_method $cors_method_header {
    OPTIONS 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
    default 'GET, POST, PUT, DELETE, PATCH';
}

# ====== Catch-all: Unknown subdomains return 404 ======
server {
    listen 80 default_server;
    server_name _;
    return 301 https://iacgenie.com$request_uri;
}

# ====== HTTP: Base domain — serve landing page ======
server {
    listen 80;
    server_name iacgenie.com www.iacgenie.com;

    root /home/mkanavi/docker/iacgenie/landing;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"iacgenie-landing"}';
        add_header Content-Type application/json always;
    }
}

# ====== HTTP: Cloudflare tunnel passthrough ======
# cloudflared proxies to port 80 with original Host header
# Each vHost is a separate server block to avoid duplicate location errors

# Keycloak (auth)
server {
    listen 80;
    server_name auth.iacgenie.com;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 86400;
        proxy_redirect off;
        proxy_hide_header X-Powered-By;
    }
}

