---
# ansible/fetch-github-secrets.yml
# Fetches all secrets from GitHub Actions repository secrets
# and installs them on the target VM for service bootstrapping.
#
# Usage:
#   ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook ansible/fetch-github-secrets.yml
#
# Requirements:
#   - gh CLI installed and authenticated on the Ansible controller
#   - SSH access to the VM
#   - GitHub token with repo:secret scope

- name: Fetch secrets from GitHub repository
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    github_repo: "manjufkanavi/iacgenie-platform"
    vm_user: "mkanavi"
    vm_host: "192.168.0.118"
    vm_ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/newvm_key"
    target_env: "/home/mkanavi/docker/iacgenie/.env"
    secrets_dir: "/home/mkanavi/docker/iacgenie/data/openbao_raft/service_tokens"

  tasks:
    - name: List all GitHub secrets
      ansible.builtin.command:
        cmd: "gh secret list --repo {{ github_repo }} --format '{{.Name}}'"
      register: secret_names
      changed_when: false

    - name: Parse secret names
      ansible.builtin.set_fact:
        all_secrets: "{{ secret_names.stdout_lines }}"
      changed_when: false

    - name: Fetch each secret value
      ansible.builtin.command:
        cmd: "gh secret view {{ item }} --repo {{ github_repo }}"
      loop: "{{ all_secrets }}"
      register: secret_values
      changed_when: false
      no_log: true

    - name: Build secret dict
      ansible.builtin.set_fact:
        secrets_dict: "{{ secrets_dict | default({}) | combine({item.item: item.stdout}) }}"
      loop: "{{ secret_values.results }}"
      no_log: true

    - name: Generate .env file content
      ansible.builtin.template:
        src: templates/env.j2
        dest: "/tmp/github_secrets.env"
      vars:
        secrets: "{{ secrets_dict }}"

    - name: Deploy .env file to VM
      ansible.builtin.copy:
        src: "/tmp/github_secrets.env"
        dest: "{{ target_env }}"
        mode: "0600"
      no_log: true

    - name: Deploy service tokens to VM
      loop:
        - name: iacgenie-service
          key: "{{ secrets_dict.get('IACGENIE_SERVICE_TOKEN', '') }}"
        - name: lightserp
          key: "{{ secrets_dict.get('LIGHTSERP_TOKEN', '') }}"
        - name: terraform
          key: "{{ secrets_dict.get('TERRAFORM_TOKEN', '') }}"
      ansible.builtin.copy:
        content: "{{ item.key }}"
        dest: "{{ secrets_dir }}/{{ item.name }}.token"
        mode: "0600"
      no_log: true

    - name: Restart services that need new secrets
      ansible.builtin.shell: |
        cd /home/mkanavi/docker/iacgenie
        docker compose restart postgres redis minio keycloak iacgenie_platform lightserp-api
      changed_when: true

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: "Deployed {{ all_secrets | length }} secrets to VM at {{ vm_host }}:{{ target_env }}"
