name: SAST - LightSerp

on:
  push:
    branches: [main, devops]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sast-lightserp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build SAST image
        run: docker build -t iacgenie-sast:latest .sast/

      - name: Verify toolchain
        run: docker run --rm iacgenie-sast:latest /usr/local/bin/sast-version

      - name: Run Ruff (Python lint)
        id: ruff
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'cd /workspace && mkdir -p /tmp/artifacts && \
            ruff check --config .sast/ruff.toml lightserv --output-format json 2>/dev/null > /tmp/ruff.json; \
            python3 /workspace/.sast/sast-parse.py ruff /tmp/ruff.json /tmp/artifacts/ruff.json'

      - name: Run Bandit (Python security)
        id: bandit
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'cd /workspace && mkdir -p /tmp/artifacts && \
            bandit -q -r lightserv -c .sast/bandit.toml -f json 2>/dev/null > /tmp/bandit.json; \
            python3 /workspace/.sast/sast-parse.py bandit /tmp/bandit.json /tmp/artifacts/bandit.json'

      - name: Run Semgrep (Python security)
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'cd /workspace && mkdir -p /tmp/artifacts && \
            semgrep --config auto --json lightserv 2>/dev/null > /tmp/semgrep.json; \
            python3 /workspace/.sast/sast-parse.py semgrep /tmp/semgrep.json /tmp/artifacts/semgrep.json'

      - name: Run Mypy (Python types)
        id: mypy
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'cd /workspace && mkdir -p /tmp/artifacts && \
            mypy --config-file .sast/mypy.ini lightserv 2>/dev/null > /tmp/mypy.txt; \
            python3 /workspace/.sast/sast-parse.py mypy /tmp/mypy.txt /tmp/artifacts/mypy.json'

      - name: Run ESLint (TypeScript - webui)
        id: eslint-webui
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'cd /workspace && mkdir -p /tmp/artifacts && \
            cd lightserv/webui && eslint --format json src 2>/dev/null > /tmp/eslint.json; \
            python3 /workspace/.sast/sast-parse.py eslint /tmp/eslint.json /tmp/artifacts/eslint-webui.json'

      - name: Run ESLint (TypeScript - lightserp)
        id: eslint-lightserp
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'cd /workspace && mkdir -p /tmp/artifacts && \
            cd lightserv && eslint --format json src 2>/dev/null > /tmp/eslint.json; \
            python3 /workspace/.sast/sast-parse.py eslint /tmp/eslint.json /tmp/artifacts/eslint-lightserp.json'

      - name: Run Gitleaks (secrets)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'cd /workspace && mkdir -p /tmp/artifacts && \
            gitleaks detect --source . --config .sast/gitleaks.toml --report-format json --report-path /tmp/gitleaks.json --no-banner 2>/dev/null; \
            python3 /workspace/.sast/sast-parse.py gitleaks /tmp/gitleaks.json /tmp/artifacts/gitleaks.json'

      - name: Upload SAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-lightserp-${{ github.run_number }}
          path: /tmp/artifacts/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "=============================="
          echo "  SAST SCAN COMPLETE (LightSerp)"
          echo "=============================="
          echo "Ruff:            ${{ steps.ruff.outcome }}"
          echo "Bandit:          ${{ steps.bandit.outcome }}"
          echo "Semgrep:         ${{ steps.semgrep.outcome }}"
          echo "Mypy:            ${{ steps.mypy.outcome }}"
          echo "ESLint (webui):  ${{ steps.eslint-webui.outcome }}"
          echo "ESLint (core):   ${{ steps.eslint-lightserp.outcome }}"
          echo "Gitleaks:        ${{ steps.gitleaks.outcome }}"
          echo "=============================="
          echo "NOTE: Findings are informational. Build does NOT fail on SAST errors."
          echo "JSON reports uploaded as artifact: sast-lightserp-${{ github.run_number }}"
