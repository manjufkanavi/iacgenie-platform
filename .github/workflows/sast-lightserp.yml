name: SAST - LightSerp

on:
  push:
    branches: [main, devops]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sast-lightserp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build SAST image
        run: docker build -t iacgenie-sast:latest .sast/

      - name: Verify toolchain
        run: docker run --rm iacgenie-sast:latest /usr/local/bin/sast-version

      - name: Run Ruff (Python lint)
        id: ruff
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'mkdir -p /tmp/artifacts && cd /workspace && ruff check --config .sast/ruff.toml lightserv --output-format json 2>/dev/null > /tmp/ruff.json; \
            python3 -c "
import json
d=json.load(open(\"/tmp/ruff.json\"))
out={\"tool\":\"ruff\",\"total\":len(d),\"errors\":[{\"file\":x[\"filename\"],\"code\":x[\"code\"],\"line\":x[\"location\"][\"row\"],\"column\":x[\"location\"][\"column\"],\"message\":x[\"message\"]} for x in d]}
json.dump(out,open(\"/tmp/artifacts/ruff.json\",\"w\"),indent=2)
print(\"ruff: \",len(d),\"findings\")
"'

      - name: Run Bandit (Python security)
        id: bandit
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'mkdir -p /tmp/artifacts && cd /workspace && bandit -q -r lightserv -c .sast/bandit.toml -f json 2>/dev/null > /tmp/bandit.json; \
            python3 -c "
import json
d=json.load(open(\"/tmp/bandit.json\"))
res=d.get(\"results\",[])
out={\"tool\":\"bandit\",\"total\":len(res),\"errors\":[{\"file\":r[\"filename\"],\"test_id\":r[\"test_id\"],\"severity\":r[\"issue_severity\"],\"confidence\":r[\"issue_confidence\"],\"text\":r[\"issue_text\"]} for r in res]}
json.dump(out,open(\"/tmp/artifacts/bandit.json\",\"w\"),indent=2)
print(\"bandit: \",len(res),\"findings\")
"'

      - name: Run Semgrep (Python security)
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'mkdir -p /tmp/artifacts && cd /workspace && semgrep --config auto --json lightserv 2>/dev/null > /tmp/semgrep.json; \
            python3 -c "
import json
d=json.load(open(\"/tmp/semgrep.json\"))
res=d.get(\"results\",[])
out={\"tool\":\"semgrep\",\"total\":len(res),\"errors\":[{\"file\":r[\"path\"],\"check_id\":r[\"check_id\"],\"severity\":r[\"extra\"].get(\"severity\"),\"message\":r[\"extra\"].get(\"message\")} for r in res]}
json.dump(out,open(\"/tmp/artifacts/semgrep.json\",\"w\"),indent=2)
print(\"semgrep: \",len(res),\"findings\")
"'

      - name: Run Mypy (Python types)
        id: mypy
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'mkdir -p /tmp/artifacts && cd /workspace && mypy --config-file .sast/mypy.ini lightserv 2>/dev/null > /tmp/mypy.txt; \
            python3 -c "
import json,re
lines=[l for l in open(\"/tmp/mypy.txt\") if \": error:\" in l]
out={\"tool\":\"mypy\",\"total\":len(lines),\"errors\":[]}
for l in lines:
    m=re.match(r\"^([^:]+):(\\d+): error: (.*)$\", l.strip())
    if m: out[\"errors\"].append({\"file\":m.group(1),\"line\":int(m.group(2)),\"message\":m.group(3)})
json.dump(out,open(\"/tmp/artifacts/mypy.json\",\"w\"),indent=2)
print(\"mypy: \",len(out[\"errors\"]),\"findings\")
"'

      - name: Run ESLint (TypeScript - src)
        id: eslint-src
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'mkdir -p /tmp/artifacts && cd /workspace/lightserv && eslint --format json src 2>/dev/null > /tmp/eslint.json; \
            python3 -c "
import json
d=json.load(open(\"/tmp/eslint.json\"))
msgs=[m for x in d for m in x[\"messages\"]]
out={\"tool\":\"eslint\",\"files\":len(d),\"total\":len(msgs),\"errors\":[{\"file\":x[\"filePath\"],\"line\":m[\"line\"],\"column\":m[\"column\"],\"rule\":m[\"ruleId\"],\"severity\":m[\"severity\"],\"message\":m[\"message\"]} for x in d for m in x[\"messages\"]]}
json.dump(out,open(\"/tmp/artifacts/eslint.json\",\"w\"),indent=2)
print(\"eslint: \",len(msgs),\"findings\")
"'

      - name: Run ESLint (TypeScript - webui)
        id: eslint-webui
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'mkdir -p /tmp/artifacts && cd /workspace/lightserv/webui && eslint --format json src 2>/dev/null > /tmp/eslint.json; \
            python3 -c "
import json
d=json.load(open(\"/tmp/eslint.json\"))
msgs=[m for x in d for m in x[\"messages\"]]
out={\"tool\":\"eslint\",\"files\":len(d),\"total\":len(msgs),\"errors\":[{\"file\":x[\"filePath\"],\"line\":m[\"line\"],\"column\":m[\"column\"],\"rule\":m[\"ruleId\"],\"severity\":m[\"severity\"],\"message\":m[\"message\"]} for x in d for m in x[\"messages\"]]}
json.dump(out,open(\"/tmp/artifacts/eslint-webui.json\",\"w\"),indent=2)
print(\"eslint-webui: \",len(msgs),\"findings\")
"'

      - name: Run Gitleaks (secrets)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/workspace iacgenie-sast:latest \
            bash -c 'mkdir -p /tmp/artifacts && cd /workspace && gitleaks detect --source . --config .sast/gitleaks.toml --report-format json --report-path /tmp/gitleaks.json --no-banner 2>/dev/null; \
            python3 -c "
import json
d=json.load(open(\"/tmp/gitleaks.json\"))
out={\"tool\":\"gitleaks\",\"total\":len(d),\"errors\":[{\"file\":f[\"File\"],\"rule\":f[\"RuleID\"],\"secret\":f[\"Secret\"],\"start_line\":f[\"StartLine\"],\"end_line\":f[\"EndLine\"]} for f in d]}
json.dump(out,open(\"/tmp/artifacts/gitleaks.json\",\"w\"),indent=2)
print(\"gitleaks: \",len(d),\"findings\")
"'

      - name: Upload SAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-lightserp-${{ github.run_number }}
          path: /tmp/artifacts/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "=============================="
          echo "  SAST SCAN COMPLETE (LightSerp)"
          echo "=============================="
          echo "Ruff:     ${{ steps.ruff.outcome }}"
          echo "Bandit:   ${{ steps.bandit.outcome }}"
          echo "Semgrep:  ${{ steps.semgrep.outcome }}"
          echo "Mypy:     ${{ steps.mypy.outcome }}"
          echo "ESLint:   ${{ steps.eslint-src.outcome }}"
          echo "ESLint:   ${{ steps.eslint-webui.outcome }}"
          echo "Gitleaks: ${{ steps.gitleaks.outcome }}"
          echo "=============================="
          echo "NOTE: Findings are informational. Build does NOT fail on SAST errors."
          echo "JSON reports uploaded as artifact: sast-lightserp-${{ github.run_number }}"
